name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the toolchain line in go.mod.
          go-version-file: go.mod
          cache: true

      - name: go mod tidy is a no-op
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          diff -u go.mod.bak go.mod
          diff -u go.sum.bak go.sum
          rm go.mod.bak go.sum.bak

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  # plan/00-SPINE.md S9-AMENDED splits Anvil into two distribution artifacts:
  # anvil (core, no network-probing capability compiled in) and anvil-dast.
  # plan/IMPLEMENTATION-PLAN.md 2.2 rules that a config flag inside a single
  # binary does not address the concern the split exists for. This job is what
  # makes the split real rather than conventional.
  artifact-split:
    name: Two-artifact split (S9-AMENDED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -count=1 is load-bearing, not decoration. TestSplit shells out to
      # `go list -deps`, and Go's test-result cache does not track the output of
      # an external command -- so with the build cache restored by setup-go it
      # will happily replay a previous PASS for a package whose import graph has
      # since changed. That is exactly the stale-pass this guard exists to
      # prevent, and it defeated the negative control on the first run against
      # a warm cache.
      - name: Core binary has no DAST capability in its import graph
        run: go test -count=1 ./cmd/anvil -run TestSplit -v

      - name: Negative control -- the guard must be able to fail
        run: |
          set -e
          mkdir -p internal/dast/ciprobe
          cat > internal/dast/ciprobe/probe.go <<'EOF'
          package ciprobe

          const Sentinel = "ci-negative-control"
          EOF
          cat > cmd/anvil/ci_negctl.go <<'EOF'
          package main

          import _ "github.com/Susquehanna-Syntax/Anvil/internal/dast/ciprobe"
          EOF
          # Capture the output rather than just the exit code. A nonzero exit
          # proves only that something went wrong -- a compile error would also
          # produce one, and would let a broken guard masquerade as a working
          # one. Assert the guard failed for the RIGHT reason, naming the
          # package it was supposed to catch.
          set +e
          out=$(go test -count=1 ./cmd/anvil -run TestSplit 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -eq 0 ]; then
            echo "::error::TestSplit PASSED with an internal/dast import present. The guard is a no-op."
            exit 1
          fi
          if ! echo "$out" | grep -q 'internal/dast/ciprobe'; then
            echo "::error::TestSplit failed, but not by detecting internal/dast/ciprobe. The guard may be broken rather than working."
            exit 1
          fi
          case "$out" in
            *"(cached)"*)
              echo "::error::Go replayed a cached result instead of running the test. -count=1 is not taking effect."
              exit 1
              ;;
          esac
          echo "guard correctly failed on the injected violation, naming internal/dast/ciprobe"
          rm -f cmd/anvil/ci_negctl.go
          rm -rf internal/dast/ciprobe
          go test -count=1 ./cmd/anvil -run TestSplit

      - name: Static, cgo-free builds for both artifacts
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          for goarch in amd64 arm64; do
            for target in anvil anvil-dast; do
              GOOS=linux GOARCH=$goarch go build -o "/tmp/${target}-linux-${goarch}" "./cmd/${target}"
              file "/tmp/${target}-linux-${goarch}"
            done
          done
          # S12 mandates modernc.org/sqlite precisely so no cgo/C toolchain is
          # needed. mattn/go-sqlite3 would reintroduce both.
          if go list -deps ./... | grep -q 'github.com/mattn/go-sqlite3'; then
            echo "::error::mattn/go-sqlite3 is in the dependency graph. S12 mandates modernc.org/sqlite."
            exit 1
          fi

  # The one control in this repository that cannot be proven without a real
  # third-party binary: that a real scanner does not report a vulnerable fixture
  # clean. Everything else about the SCA collector can be tested against
  # recorded output, but "the tool ran and found nothing" and "the tool was not
  # there" are indistinguishable to a caller, and for a security scanner that is
  # the worst possible failure -- an empty result reads as a clean repository.
  #
  # internal/SKIPPED-CONTROLS.md item N1 recorded this as OPEN: the test was
  # correctly made fatal-when-opted-in rather than skip-when-opted-in, which
  # made it honest, but no machine anywhere set the opt-in, so the control was
  # proven on NOTHING. This job is what closes it. If it is ever removed, that
  # control silently stops existing again.
  trivy-e2e:
    name: SCA end-to-end (real Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Trivy
        run: |
          set -euo pipefail
          # Pinned by VERSION AND DIGEST. S8 wants versions pinned; a digest is
          # what makes the pin mean something, since a tag can be moved.
          #
          # Both values were read from the GitHub releases API rather than written
          # from memory -- the first version here was invented and 404'd, which is
          # the same assert-from-memory failure this project keeps catching in its
          # own code. The digest is GitHub's, computed over the stored bytes: a
          # primary source, but not an independent re-hash, and that distinction
          # is the same one M0.7 flagged about its own opengrep pins.
          TRIVY_VERSION=0.73.0
          TRIVY_SHA256=2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      # The collector invokes Trivy with --skip-db-update --offline-scan, which
      # is the correct posture -- S0 says Anvil never browses the live web at
      # inference time -- but it means Trivy REFUSES TO RUN AT ALL until a
      # database exists locally. The first run of this job proved that: FATAL
      # "--skip-db-update cannot be specified on the first run".
      #
      # That is a genuine operational dependency, not a CI quirk, and no test
      # against recorded Trivy output could have surfaced it. In production the
      # database is what A.11's warm-start accelerator supplies; here we seed it
      # the ordinary way so the E2E control exercises the real invocation.
      - name: Seed the Trivy vulnerability database
        run: trivy image --download-db-only

      - name: The opt-in is set, so a missing binary must FAIL rather than skip
        env:
          ANVIL_TRIVY_E2E: "1"
        run: go test -count=1 -v -run TestRealTrivyScansAFixtureRepo ./internal/collector/repo/

      - name: Negative control -- the job must fail if Trivy disappears
        env:
          ANVIL_TRIVY_E2E: "1"
        run: |
          set -uo pipefail
          sudo mv /usr/local/bin/trivy /usr/local/bin/trivy.hidden
          if go test -count=1 -run TestRealTrivyScansAFixtureRepo ./internal/collector/repo/; then
            sudo mv /usr/local/bin/trivy.hidden /usr/local/bin/trivy
            echo "::error::The E2E test PASSED with no Trivy binary present. The opt-in gate is not fatal, so this job proves nothing."
            exit 1
          fi
          sudo mv /usr/local/bin/trivy.hidden /usr/local/bin/trivy
          echo "confirmed: with ANVIL_TRIVY_E2E=1 and no binary, the test fails rather than skipping"

  # plan/00-SPINE.md S12 permits Python in exactly three places, and the
  # evaluation harness is one of them. eval/ is a pure-Python tree.
  #
  # The register this job validates is the artifact plan step M0.18 reads to
  # decide whether Anvil's detection-model tier exists at all, so the property
  # that matters is narrow and absolute: a row whose experiment has not run must
  # never be readable as a pass. The schema encodes that; this job is what makes
  # anything actually run the schema. It shipped with nothing in the repository
  # checking one against the other, and a schema nobody runs is a comment.
  eval-harness:
    name: Eval harness (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # [dev] carries pytest/ruff. Core deps are deliberately minimal -- the
      # heavy [stats] and [models] extras are pulled by the packets that need
      # them (M0.6, M0.10, M0.15), not here.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Tests, including the register mutation suite
        run: python -m pytest tests/ -q

      # A skipped test is a legitimate outcome here -- M0.7's smoke path is
      # UNVERIFIED by design because nothing downloads the opengrep engine in
      # CI. But a suite that silently degrades to all-skips would still report
      # green, so assert the register suite actually ran.
      - name: The register mutation suite really ran
        run: |
          out=$(python -m pytest tests/test_register_schema.py -q 2>&1)
          echo "$out"
          echo "$out" | grep -qE '[0-9]+ passed' || {
            echo "::error::register schema suite reported no passing tests"; exit 1; }

  # NOTE: there is deliberately no "plan" job here. The planning workspace
  # (plan/) and its verification tooling (tools/) are local-only and gitignored,
  # same posture as research/ -- they are how Anvil was designed and verified,
  # not something a consumer of Anvil receives. The cross-reference invariants
  # those tools enforce are therefore checked locally by the maintainer before
  # dispatch, not in CI, because CI cannot see the files. Everything CI *can*
  # see -- the artifact split, the licence bodies, the build -- is still gated
  # below.

  licence:
    name: Licence hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # plan/00-SPINE.md S8: read LICENSE file bodies, never API metadata.
      # Seven audited artifacts return NOASSERTION over a real licence and one
      # hides a restrictive licence behind a permissive tag.
      - name: LICENSE is canonical Apache-2.0
        run: |
          expected=cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30
          actual=$(sha256sum LICENSE | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::LICENSE sha256 is $actual, expected the canonical Apache-2.0 $expected"
            exit 1
          fi

      - name: Required compliance files exist
        run: |
          set -e
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES.md; do
            test -s "$f" || { echo "::error::$f missing or empty (plan step C.1)"; exit 1; }
          done

      # plan/00-SPINE.md S5 is enforced, not advisory. This is a coarse
      # placeholder for cmd/license-gate (plan steps C.9/C.10), which reads
      # licence bodies properly; it exists so the exclusion list is not purely
      # documentary between now and Phase 6.
      - name: Hard exclusions (S5) are absent from the dependency graph
        run: |
          set -e
          fail=0
          # Deliberately narrow: module paths only, so prose in plan/ and
          # NOTICE -- which must be free to *name* these to explain the
          # exclusions -- does not trip the gate.
          for banned in \
            "github.com/github/codeql" \
            "github.com/returntocorp/semgrep" \
            "github.com/opengrep/opengrep-rules" \
            "github.com/AFLplusplus/AFLplusplus" \
            "github.com/mattn/go-sqlite3" ; do
            if grep -rn --include=go.mod --include=go.sum "$banned" . ; then
              echo "::error::$banned is on the S5 hard exclusion list"
              fail=1
            fi
          done
          exit $fail
