name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the toolchain line in go.mod.
          go-version-file: go.mod
          cache: true

      - name: go mod tidy is a no-op
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          diff -u go.mod.bak go.mod
          diff -u go.sum.bak go.sum
          rm go.mod.bak go.sum.bak

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      # THE SECOND LANE, and it is not redundant with the one above.
      #
      # internal/dast/authz/phase1_scopebytes_race_test.go carries
      # `//go:build !race`, so `go test -race` DOES NOT COMPILE IT. That build
      # tag is legitimate -- the harness works by racing a writer against the
      # caller's scope buffer, which is a data race by construction, and the
      # detector reports it against the FIX on a correct tree. What was not
      # legitimate is that this workflow ran only the -race lane, so
      # TestScopeBytesAreReadOnceUnderAConcurrentWriter -- the behavioural
      # control whose measured numbers are in docs/controls.md
      # under G4-1 (0 of 200 constructed Scopes mismatched on the shipped tree,
      # 89 of 200 with the copy deleted, 102 of 200 with the copy replaced by
      # `rawAlias := raw[:]`) -- was compiled in ZERO CI lanes. Recorded as N3;
      # this step is what closes it.
      #
      # -count=1 for the reason the artifact-split job spells out at length.
      - name: go test without -race (the !race lane compiles here and nowhere else)
        run: go test -count=1 ./...

      # A `go test -run X` that matches NOTHING exits 0 and prints
      # "no tests to run". That is exactly how this lane would rot: the file is
      # renamed or the build tag spreads, the step above still passes, and the
      # control is gone again. So assert the named test actually ran and
      # actually passed, and fail the job on either.
      - name: The !race concurrency harness really ran, and passed
        run: |
          set +e
          out=$(go test -count=1 -v -run TestScopeBytesAreReadOnceUnderAConcurrentWriter ./internal/dast/authz/ 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "::error::the !race concurrency harness FAILED"
            exit 1
          fi
          if ! echo "$out" | grep -q -- '--- PASS: TestScopeBytesAreReadOnceUnderAConcurrentWriter'; then
            echo "::error::TestScopeBytesAreReadOnceUnderAConcurrentWriter did not run. A -run pattern that matches nothing exits 0; this lane proves nothing until the test is actually compiled and executed."
            exit 1
          fi
          case "$out" in
            *"(cached)"*)
              echo "::error::Go replayed a cached result instead of running the test. -count=1 is not taking effect."
              exit 1
              ;;
          esac
          echo "confirmed: the !race harness compiled, ran and passed in the non-race lane"

      # The Lane A exit gate prints a chain ledger naming which of its twelve
      # links it PROVED and which it could not, and it is the deliverable of
      # that packet -- "an UNPROVEN link is not a passing link". Go only shows
      # test log output on failure, so on a green run the ledger was invisible
      # and a reader saw "ok" with no idea seven of twelve links were proven.
      #
      # This step exists so the ledger is READ on the machine where it says the
      # most: ubuntu-latest has dpkg, so host.Collect runs for real here and the
      # host-inventory link is PROVEN, where on the Windows dev host it is not.
      - name: Lane A chain ledger (printed, not just passed)
        run: go test -count=1 -v -run TestLaneAChain ./test/conformance/lanea/

  # THE NON-LINUX LANE, and it exists because the single most safety-relevant
  # property in internal/dast/containment ran in ZERO CI lanes.
  #
  # SystemCommander refuses on any non-Linux GOOS. That refusal is what stops
  # Anvil reporting a sandbox as contained on a platform where it cannot check
  # anything -- the claim that authorizes firing DAST probes at all. Its only
  # guard, TestSystemCommanderRefusesOffLinux, branches on runtime.GOOS: on
  # Linux it asserts a Commander comes back, and every job above runs on
  # ubuntu-latest. So the refusal branch was never executed anywhere, and
  # deleting the `runtime.GOOS != "linux"` check would have left every lane
  # green.
  #
  # A control that runs in zero CI lanes is not a control. This job runs the
  # containment package on Windows, where the refusal is the branch taken.
  #
  # Scoped to the one package deliberately: the point is the platform branch,
  # not Windows portability of the whole tree, and a broad Windows lane would
  # fail for unrelated reasons and get switched off.
  #
  # No -race here: the detector needs a gcc toolchain on Windows and the
  # ubuntu lane above already runs the whole tree under it.
  containment-non-linux:
    name: Containment refuses off Linux (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -count=1 for the reason the artifact-split job spells out: this repo
      # has been bitten by a replayed cached PASS twice.
      - name: The whole containment package, on a platform with no netns
        run: go test -count=1 ./internal/dast/containment/

      # A `go test -run X` that matches NOTHING exits 0 and prints "no tests to
      # run", which is exactly how this lane would rot. Assert the named test
      # ran, passed, and was not replayed from cache.
      - name: The platform refusal really ran, and passed
        run: |
          set +e
          out=$(go test -count=1 -v -run TestSystemCommanderRefusesOffLinux ./internal/dast/containment/ 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "::error::the platform refusal guard FAILED"
            exit 1
          fi
          if ! echo "$out" | grep -q -- '--- PASS: TestSystemCommanderRefusesOffLinux'; then
            echo "::error::TestSystemCommanderRefusesOffLinux did not run. A -run pattern that matches nothing exits 0; this lane proves nothing until the test is actually executed."
            exit 1
          fi
          case "$out" in
            *"(cached)"*)
              echo "::error::Go replayed a cached result instead of running the test. -count=1 is not taking effect."
              exit 1
              ;;
          esac
          echo "confirmed: the non-Linux refusal branch compiled, ran and passed"

      # Negative control. Without it this lane proves only that a green test is
      # green -- it would still pass if SystemCommander returned a working
      # Commander on Windows AND the assertion had been softened. Delete the
      # platform check, require the guard to go RED, and require it to go red
      # for the RIGHT REASON: naming the platform it was handed a Commander on.
      - name: Negative control -- the guard must be able to fail
        run: |
          set -e
          f=internal/dast/containment/netns.go
          grep -q 'if runtime.GOOS != "linux" {' "$f" || {
            echo "::error::the platform check is not where this control expects it in $f. The negative control cannot inject its mutation, so it is not testing anything."
            exit 1
          }
          sed -i 's/if runtime.GOOS != "linux" {/if false {/' "$f"
          set +e
          out=$(go test -count=1 -run TestSystemCommanderRefusesOffLinux ./internal/dast/containment/ 2>&1)
          rc=$?
          set -e
          echo "$out"
          git checkout -- "$f"
          git diff --exit-code -- "$f" || {
            echo "::error::the source was not restored byte-for-byte after the mutation"
            exit 1
          }
          if [ $rc -eq 0 ]; then
            echo "::error::TestSystemCommanderRefusesOffLinux PASSED with the platform refusal deleted. The guard is a no-op and containment could report success on a platform where nothing was checked."
            exit 1
          fi
          if ! echo "$out" | grep -q 'SystemCommander returned a Commander'; then
            echo "::error::the guard failed, but not by detecting that a Commander came back off Linux. It may be broken rather than working."
            exit 1
          fi
          case "$out" in
            *"(cached)"*)
              echo "::error::Go replayed a cached result instead of running the test. -count=1 is not taking effect."
              exit 1
              ;;
          esac
          echo "guard correctly went red on the injected mutation, naming the returned Commander"

      - name: The tree is clean again, and the guard is green again
        run: |
          set -e
          git diff --exit-code
          go test -count=1 -run TestSystemCommanderRefusesOffLinux ./internal/dast/containment/

  # The two-artifact split splits Anvil into two distribution artifacts:
  # anvil (core, no network-probing capability compiled in) and anvil-dast.
  # The first plan's two-artifact ruling holds that a config flag inside a single
  # binary does not address the concern the split exists for. This job is what
  # makes the split real rather than conventional.
  artifact-split:
    name: Two-artifact split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -count=1 is load-bearing, not decoration. TestSplit shells out to
      # `go list -deps`, and Go's test-result cache does not track the output of
      # an external command -- so with the build cache restored by setup-go it
      # will happily replay a previous PASS for a package whose import graph has
      # since changed. That is exactly the stale-pass this guard exists to
      # prevent, and it defeated the negative control on the first run against
      # a warm cache.
      - name: Core binary has no DAST capability in its import graph
        run: go test -count=1 ./cmd/anvil -run TestSplit -v

      - name: Negative control -- the guard must be able to fail
        run: |
          set -e
          mkdir -p internal/dast/ciprobe
          cat > internal/dast/ciprobe/probe.go <<'EOF'
          package ciprobe

          const Sentinel = "ci-negative-control"
          EOF
          cat > cmd/anvil/ci_negctl.go <<'EOF'
          package main

          import _ "github.com/Susquehanna-Syntax/Anvil/internal/dast/ciprobe"
          EOF
          # Capture the output rather than just the exit code. A nonzero exit
          # proves only that something went wrong -- a compile error would also
          # produce one, and would let a broken guard masquerade as a working
          # one. Assert the guard failed for the RIGHT reason, naming the
          # package it was supposed to catch.
          set +e
          out=$(go test -count=1 ./cmd/anvil -run TestSplit 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -eq 0 ]; then
            echo "::error::TestSplit PASSED with an internal/dast import present. The guard is a no-op."
            exit 1
          fi
          if ! echo "$out" | grep -q 'internal/dast/ciprobe'; then
            echo "::error::TestSplit failed, but not by detecting internal/dast/ciprobe. The guard may be broken rather than working."
            exit 1
          fi
          case "$out" in
            *"(cached)"*)
              echo "::error::Go replayed a cached result instead of running the test. -count=1 is not taking effect."
              exit 1
              ;;
          esac
          echo "guard correctly failed on the injected violation, naming internal/dast/ciprobe"
          rm -f cmd/anvil/ci_negctl.go
          rm -rf internal/dast/ciprobe
          go test -count=1 ./cmd/anvil -run TestSplit

      - name: Static, cgo-free builds for both artifacts
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          for goarch in amd64 arm64; do
            for target in anvil anvil-dast; do
              GOOS=linux GOARCH=$goarch go build -o "/tmp/${target}-linux-${goarch}" "./cmd/${target}"
              file "/tmp/${target}-linux-${goarch}"
            done
          done
          # the spine's Go control-plane decision mandates modernc.org/sqlite
          # precisely so no cgo/C toolchain is needed. mattn/go-sqlite3 would
          # reintroduce both.
          if go list -deps ./... | grep -q 'github.com/mattn/go-sqlite3'; then
            echo "::error::mattn/go-sqlite3 is in the dependency graph. The spine's Go control-plane decision mandates modernc.org/sqlite."
            exit 1
          fi

  # The one control in this repository that cannot be proven without a real
  # third-party binary: that a real scanner does not report a vulnerable fixture
  # clean. Everything else about the SCA collector can be tested against
  # recorded output, but "the tool ran and found nothing" and "the tool was not
  # there" are indistinguishable to a caller, and for a security scanner that is
  # the worst possible failure -- an empty result reads as a clean repository.
  #
  # docs/controls.md item N1 recorded this as OPEN: the test was
  # correctly made fatal-when-opted-in rather than skip-when-opted-in, which
  # made it honest, but no machine anywhere set the opt-in, so the control was
  # proven on NOTHING. This job is what closes it. If it is ever removed, that
  # control silently stops existing again.
  trivy-e2e:
    name: SCA end-to-end (real Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Trivy
        run: |
          set -euo pipefail
          # Pinned by VERSION AND DIGEST. The spine's licence section wants
          # versions pinned; a digest is what makes the pin mean something,
          # since a tag can be moved.
          #
          # Both values were read from the GitHub releases API rather than written
          # from memory -- the first version here was invented and 404'd, which is
          # the same assert-from-memory failure this project keeps catching in its
          # own code. The digest is GitHub's, computed over the stored bytes: a
          # primary source, but not an independent re-hash, and that distinction
          # is the same one the opengrep acquisition flagged about its own opengrep pins.
          TRIVY_VERSION=0.73.0
          TRIVY_SHA256=2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      # The collector invokes Trivy with --skip-db-update --offline-scan, which
      # is the correct posture -- the spine's definition of Anvil says Anvil
      # never browses the live web at inference time -- but it means Trivy
      # REFUSES TO RUN AT ALL until a database exists locally. The first run of
      # this job proved that: FATAL "--skip-db-update cannot be specified on the
      # first run".
      #
      # That is a genuine operational dependency, not a CI quirk, and no test
      # against recorded Trivy output could have surfaced it. In production the
      # database is what the warm-start accelerator supplies; here we seed it
      # the ordinary way so the E2E control exercises the real invocation.
      - name: Seed the Trivy vulnerability database
        run: trivy image --download-db-only

      - name: The opt-in is set, so a missing binary must FAIL rather than skip
        env:
          ANVIL_TRIVY_E2E: "1"
        run: go test -count=1 -v -run TestRealTrivyScansAFixtureRepo ./internal/collector/repo/

      - name: Negative control -- the job must fail if Trivy disappears
        env:
          ANVIL_TRIVY_E2E: "1"
        run: |
          set -uo pipefail
          sudo mv /usr/local/bin/trivy /usr/local/bin/trivy.hidden
          if go test -count=1 -run TestRealTrivyScansAFixtureRepo ./internal/collector/repo/; then
            sudo mv /usr/local/bin/trivy.hidden /usr/local/bin/trivy
            echo "::error::The E2E test PASSED with no Trivy binary present. The opt-in gate is not fatal, so this job proves nothing."
            exit 1
          fi
          sudo mv /usr/local/bin/trivy.hidden /usr/local/bin/trivy
          echo "confirmed: with ANVIL_TRIVY_E2E=1 and no binary, the test fails rather than skipping"

  # The spine's Go control-plane decision permits Python in exactly three places, and the
  # evaluation harness is one of them. eval/ is a pure-Python tree.
  #
  # The register this job validates is the artifact the gate decision reads to
  # decide whether Anvil's detection-model tier exists at all, so the property
  # that matters is narrow and absolute: a row whose experiment has not run must
  # never be readable as a pass. The schema encodes that; this job is what makes
  # anything actually run the schema. It shipped with nothing in the repository
  # checking one against the other, and a schema nobody runs is a comment.
  eval-harness:
    name: Eval harness (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # [dev] carries pytest/ruff. Core deps are deliberately minimal -- the
      # heavy [stats] and [models] extras are pulled by the packets that need
      # them (the candidate-model acquisition, the code-metrics baseline, the
      # encoder round-trip measurement), not here.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Tests, including the register mutation suite
        run: python -m pytest tests/ -q

      # A skipped test is a legitimate outcome here -- the opengrep acquisition's smoke path is
      # UNVERIFIED by design because nothing downloads the opengrep engine in
      # CI. But a suite that silently degrades to all-skips would still report
      # green, so assert the register suite actually ran.
      - name: The register mutation suite really ran
        run: |
          out=$(python -m pytest tests/test_register_schema.py -q 2>&1)
          echo "$out"
          echo "$out" | grep -qE '[0-9]+ passed' || {
            echo "::error::register schema suite reported no passing tests"; exit 1; }

  # NOTE: there is deliberately no "plan" job here. The planning workspace
  # (plan/, with its build and audit scripts) is local-only and gitignored,
  # same posture as research/ -- it is how Anvil was designed and verified,
  # not something a consumer of Anvil receives. The plan's own invariants are
  # therefore checked locally by the maintainer, not in CI, because CI cannot
  # see the files. What CI can check about the plan -- that none of the first
  # plan's step codes leak back into the tree -- is test/hygiene, which runs in
  # the go test job above. Everything else CI *can* see -- the artifact split,
  # the licence bodies, the build -- is still gated below.

  licence:
    name: Licence hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The spine's licence section: read LICENSE file bodies, never API metadata.
      # Seven audited artifacts return NOASSERTION over a real licence and one
      # hides a restrictive licence behind a permissive tag.
      - name: LICENSE is canonical Apache-2.0
        run: |
          expected=cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30
          actual=$(sha256sum LICENSE | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::LICENSE sha256 is $actual, expected the canonical Apache-2.0 $expected"
            exit 1
          fi

      - name: Required compliance files exist
        run: |
          set -e
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES.md; do
            test -s "$f" || { echo "::error::$f missing or empty (the licence files)"; exit 1; }
          done

      # The spine's exclusion list is enforced, not advisory. This is a coarse
      # placeholder for cmd/license-gate (plan node spdxgate), which reads
      # licence bodies properly; it exists so the exclusion list is not purely
      # documentary until that gate lands.
      - name: Hard exclusions are absent from the dependency graph
        run: |
          set -e
          fail=0
          # Deliberately narrow: module paths only, so prose in plan/ and
          # NOTICE -- which must be free to *name* these to explain the
          # exclusions -- does not trip the gate.
          for banned in \
            "github.com/github/codeql" \
            "github.com/returntocorp/semgrep" \
            "github.com/opengrep/opengrep-rules" \
            "github.com/AFLplusplus/AFLplusplus" \
            "github.com/mattn/go-sqlite3" ; do
            if grep -rn --include=go.mod --include=go.sum "$banned" . ; then
              echo "::error::$banned is on the spine's hard-exclusion list"
              fail=1
            fi
          done
          exit $fail
