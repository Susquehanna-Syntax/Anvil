# Anvil advisory feed table — EXAMPLE.
#
# This file renders the Feed Table of plan/20-lane-a-ingestion-sca.md as the
# document internal/ingest/config parses. It is documentation and the loader's
# acceptance fixture; it is never a runtime default. Copy it to feeds.yaml,
# set your own credential_env names, and decide your own enabled flags.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS AT ALL
# ---------------------------------------------------------------------------
# research/06 Recommendation item 4: "Every cadence above lives in config,
# never in code." A feed URL, a cadence, or a credential written as a Go
# literal anywhere in Lane A is a defect, and feeds_test.go asserts that
# mechanically against feeds.go. Everything Lane A knows about a feed is here.
#
# ---------------------------------------------------------------------------
# LICENCE IS A REQUIRED FIELD, NOT AN ANNOTATION
# ---------------------------------------------------------------------------
# Spine S8 makes a feed's licence a gating fact and A.4 gates on it. Every row
# states a licence: an SPDX identifier, a LicenseRef- custom id, NOASSERTION
# (nothing asserted) or NONE (no grant of rights exists). The last three must
# carry the operative sentence in license_manual_note — spine S8's
# manual-override field — because seven artifacts in the corpus report
# NOASSERTION over a real licence and one hides a restrictive one. A feed
# whose licence cannot be stated is a feed Anvil cannot use; the loader
# refuses the row rather than defaulting it.
#
# Tier 2 is share-alike (CC-BY-SA-4.0). Those rows live in segregated
# mirror/tier2/<source>/ directories with their own LICENSE files and are
# never merged into a Tier 0/1 output (research/01 Risk #3, spine S8). A.4
# owns that gate; this file only records what each source is.
#
# mirror_dir NAMES THAT DIRECTORY, and it is why the three Tier 2 rows carry
# the key: their ids are ubuntu-osv, alpine-secdb and osv-merged while their
# quarantine directories are mirror/tier2/{ubuntu,alpine,osv}. Absent, the key
# defaults to the feed id, which is right for every other row here. It is a
# configured fact rather than a mapping compiled into A.4 for the usual
# reason, and for one more: the licence evidence a gate decision rests on is
# the file in this directory, so a caller who could choose the directory could
# choose the evidence.
#
# NO FEED IS ADMITTED BY A FRESH CLONE. A.4 refuses every row until the
# publisher's own verbatim licence text has been acquired into mirror/ and its
# sha256 pinned in mirror/LICENSE-MANIFEST.toml. Nothing in this file, and no
# prose Anvil wrote, is evidence of a licence. See mirror/README.md.
#
# EPSS carries NO LICENCE. research/01 rows S18/S19 record no licence document
# and no SPDX identifier: "attribution is requested" is a request, not a grant
# of rights. It is Tier 3, opt-in, risk-accepted, shipped disabled, and Anvil
# must never describe it as open licensed.
#
# GREENBONE / OPENVAS IS DELIBERATELY ABSENT. Its community feed is ODbL-1.0
# (share-alike, quarantined) but it belongs to the dynamic/host tier, not to
# Lane A's advisory feed table — plan/IMPLEMENTATION-PLAN.md section 2.3 and
# spine S8 both say so explicitly.
#
# ---------------------------------------------------------------------------
# CREDENTIALS
# ---------------------------------------------------------------------------
# No secret appears in this file. credential_env names the ENVIRONMENT
# VARIABLE the daemon reads the secret from, and the loader refuses anything
# that is not an environment variable name — which is what stops a pasted
# token from being accepted here. A GitHub PAT is provisioned by the operator,
# never generated by Anvil. research/06 item 1: GitHub-hosted feeds are polled
# WITH the Authorization header even on requests expected to 304, because an
# authorized 304 costs zero rate-limit budget while an unauthenticated one
# consumes the 60/hour limit.
#
# ---------------------------------------------------------------------------
# ON CADENCES AND FRESHNESS SLOs
# ---------------------------------------------------------------------------
# interval_seconds, reconcile_interval_seconds and baseline_interval_seconds
# come from the Feed Table's Cadence column (research/06 Recommendation item
# 3). freshness_slo_seconds is OPERATOR POLICY, not a research finding: it is
# the age past which this feed's data is reported stale, and it is stamped
# into every record as spine S6's staleness_seconds. The values below are a
# starting point of a few missed polls; tune them. on_failure has no
# fail-the-scan option by design (research/06 Risk #5: "never fail the scan —
# serve stale data with an as_of timestamp and a staleness_seconds field").

version: 1

feeds:
  # -------------------------------------------------------------------------
  # TIER 0 — always mirrored, licence-clean, no copyleft
  # -------------------------------------------------------------------------

  # CVE List V5. Poll /releases/latest with an ETag every 15 min for the
  # cumulative delta; reconcile against the end-of-day delta daily (~17 MB);
  # re-baseline weekly as the self-heal (research/06 Comparison Table B,
  # Recommendation item 3). Bootstrap is the daily midnight baseline zip —
  # measured 570,845,537 B, research/06 S8 — NEVER a git clone: cvelistV5
  # commits every ~7 minutes, ~75,000 commits/year, and tree objects dominate
  # any partial clone (research/06 Risk #7).
  # A.8 resolves the *_all_CVEs_at_midnight.zip asset from this same releases
  # endpoint, which is why bootstrap_url is left to default to url.
  - id: cvelistv5
    url: https://api.github.com/repos/CVEProject/cvelistV5/releases/latest
    enabled: true
    auth_mode: github_token
    credential_env: ANVIL_GITHUB_TOKEN
    sync_mechanism: conditional_get_etag
    interval_seconds: 900
    reconcile_interval_seconds: 86400
    baseline_interval_seconds: 604800
    freshness_slo_seconds: 21600
    on_failure: serve_stale
    license_tier: 0
    license_spdx: CVE-TOU
    license_manual_note: "SPDX-recognised as cve-tou (research/01 S10). Attribution required; store records byte-verbatim and never republish an edited CVE record under CVE branding (research/01, CVE-TOU modification ambiguity)."
    bootstrap_mechanism: bulk_archive

  # CISA Vulnrichment. Not a feed you poll: it is delivered inside cvelistV5's
  # ADP container, so a separate fetch would be a second copy of the same
  # bytes (research/01 S14/S15). It is a row anyway because its LICENCE is
  # different from its carrier's — CC0-1.0, zero obligations — and A.4 gates
  # on per-source licence, not per-fetch.
  - id: cisa-vulnrichment
    enabled: true
    auth_mode: none
    sync_mechanism: derived
    derived_from: cvelistv5
    interval_seconds: 0
    freshness_slo_seconds: 21600
    on_failure: serve_stale
    license_tier: 0
    license_spdx: CC0-1.0
    bootstrap_mechanism: none

  # CISA KEV, via the cisagov/kev-data mirror, which research/06 S16 records
  # as the better ingestion target than the cisa.gov endpoint (that one
  # returned 403 to the corpus's fetcher, research/01 S29).
  # THE WORKED EXAMPLE FOR SPINE S8: the GitHub API reports NOASSERTION for
  # this repository. The LICENSE/README body says CC0. Trust the body, not the
  # metadata — a pure-SPDX-metadata gate would wrongly reject this feed.
  - id: cisa-kev
    url: https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json
    enabled: true
    auth_mode: github_token
    credential_env: ANVIL_GITHUB_TOKEN
    sync_mechanism: conditional_get_etag
    interval_seconds: 900
    freshness_slo_seconds: 86400
    on_failure: serve_stale
    license_tier: 0
    license_spdx: CC0-1.0
    license_manual_note: "GitHub API metadata reports NOASSERTION; the repository README states: \"This data repository is licensed under the CC0 license, which allows for universal public domain use of the information here.\" (research/06 S16, research/01 S16/S17)."
    bootstrap_mechanism: bulk_archive

  # CWE 4.20 — 944 classes, a few MB, no delta mechanism, quarterly-ish
  # (research/01 S20/S21). It is Lane B's label space (spine S1 requirement
  # 8), mirrored here because it is an advisory-side bulk artifact like the
  # rest. MITRE's Terms of Use have no SPDX identifier, so the row declares a
  # LicenseRef- custom id and carries the note.
  - id: cwe
    url: https://cwe.mitre.org/data/xml/cwec_latest.xml.zip
    enabled: true
    auth_mode: none
    sync_mechanism: conditional_get_etag
    interval_seconds: 7776000
    freshness_slo_seconds: 15552000
    on_failure: serve_stale
    license_tier: 0
    license_spdx: LicenseRef-MITRE-CWE-ToU
    license_manual_note: "MITRE CWE Terms of Use (research/01 S20): attribution required, commercial use permitted, no SPDX identifier exists. STALE-RISK: the terms document is dated 2023-07-20 and must be re-verified before a 1.0 release."
    bootstrap_mechanism: bulk_archive

  # NVD CVE API 2.0. SUPPLEMENTARY AND DEPRIORITISED, and shipped disabled:
  # effective 2026-04-15 NIST enriches only KEV, federal-use and EO-14028
  # critical CVEs, and everything else is "Lowest Priority - not scheduled"
  # (research/06 S13). Anvil takes CVSS/CWE/CPE from the CNA and ADP
  # containers, from GHSA and from distro VEX instead. Kept as a row so an
  # operator who wants it can switch it on without editing Go.
  # Cadence and rate discipline are NIST's own: no more than once every two
  # hours, six seconds between calls, API key required (research/06 S11/S12).
  - id: nvd
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    enabled: false
    auth_mode: api_key_header
    credential_env: ANVIL_NVD_API_KEY
    credential_header: apiKey
    sync_mechanism: watermark_api
    interval_seconds: 7200
    freshness_slo_seconds: 604800
    on_failure: serve_stale
    license_tier: 0
    license_spdx: LicenseRef-US-Gov-Public-Domain
    license_manual_note: "Public domain as a US Government work (plan/20-lane-a-ingestion-sca.md Feed Table, research/01 S6). No SPDX identifier applies to that status; re-verify against NIST's own terms before redistributing."
    bootstrap_mechanism: incremental_api

  # -------------------------------------------------------------------------
  # TIER 1 — mirrored, attribution required, keep a NOTICE file
  # -------------------------------------------------------------------------

  # GHSA. Blobless partial clone plus hourly git fetch — research/06 names
  # this the right tool for GHSA specifically and the wrong tool for
  # cvelistV5. Never --depth=1: GitHub's own guidance warns that "a git fetch
  # operation in a shallow clone might end up downloading an almost-full
  # commit history" (research/06 S20, Risk #7).
  - id: ghsa
    url: https://github.com/github/advisory-database
    enabled: true
    auth_mode: github_token
    credential_env: ANVIL_GITHUB_TOKEN
    sync_mechanism: git_blobless_fetch
    interval_seconds: 3600
    freshness_slo_seconds: 86400
    on_failure: serve_stale
    license_tier: 1
    license_spdx: CC-BY-4.0
    license_manual_note: "Repository states: \"This project is licensed under the terms of the CC-BY 4.0 open source license\" (research/06 S15, research/01 S11/S12). Attribution required; keep a NOTICE file."
    bootstrap_mechanism: blobless_clone

  # Red Hat CSAF/VEX. OVAL v2 is deprecated and must not be ingested: since
  # 2024-07-10 Red Hat publishes CSAF for every RHSA and VEX for every CVE
  # touching the portfolio (research/06 S19).
  - id: redhat-csaf
    url: https://security.access.redhat.com/data/csaf/v2/vex/
    enabled: true
    auth_mode: none
    sync_mechanism: conditional_get_last_modified
    interval_seconds: 86400
    freshness_slo_seconds: 259200
    on_failure: serve_stale
    license_tier: 1
    license_spdx: CC-BY-4.0
    license_manual_note: "Red Hat states: \"Licensed under the Creative Commons Attribution 4.0 International License. If you distribute this content or a modified version of it, you must provide attribution to Red Hat, Inc.\" (research/01 S25)."
    bootstrap_mechanism: bulk_archive

  # OSV, per-ecosystem. THIS IS THE PER-ECOSYSTEM LICENCE-TAGGING BRANCH of
  # the Feed Table's OSV row: pulled one ecosystem at a time, each row carries
  # that ecosystem's own licence and tier. PyPI is CC-BY-4.0 (research/06
  # S14), so it is Tier 1 and may be mirrored alongside GHSA.
  # Add one row per ecosystem the target repos actually use — do not pull the
  # whole aggregate to get one of them.
  - id: osv-pypi
    url: https://storage.googleapis.com/osv-vulnerabilities/PyPI/all.zip
    enabled: true
    auth_mode: none
    sync_mechanism: conditional_get_last_modified
    interval_seconds: 86400
    freshness_slo_seconds: 259200
    on_failure: serve_stale
    license_tier: 1
    license_spdx: CC-BY-4.0
    license_manual_note: "OSV's source table records the PyPI database as CC-BY-4.0 (research/06 S14). Licences are per-source, never unified across the aggregate — tag every ecosystem row separately."
    bootstrap_mechanism: bulk_archive

  # -------------------------------------------------------------------------
  # TIER 2 — share-alike. Segregated mirror/tier2/<source>/ with its own
  # LICENSE, never merged into a Tier 0/1 artifact (research/01 Risk #3).
  # -------------------------------------------------------------------------

  # Ubuntu, via Canonical's OSV-format export rather than the raw OVAL bz2:
  # it merges into the same OSV pipeline Anvil already needs, and full-file
  # download is the only option OVAL documents anyway (research/06 S18).
  - id: ubuntu-osv
    url: https://storage.googleapis.com/osv-vulnerabilities/Ubuntu/all.zip
    enabled: true
    auth_mode: none
    sync_mechanism: conditional_get_last_modified
    interval_seconds: 86400
    freshness_slo_seconds: 259200
    on_failure: serve_stale
    license_tier: 2
    license_spdx: CC-BY-SA-4.0
    license_manual_note: "Canonical's own security pages state NO licence for this data (research/01 S29). The CC-BY-SA-4.0 assignment rests on OSV's source table (research/01 S7), not on a Canonical statement — re-verify against a Canonical legal page before ingesting Ubuntu directly rather than via OSV."
    mirror_dir: ubuntu
    bootstrap_mechanism: bulk_archive

  # Alpine secdb. Poll the last-update timestamp file, then refresh the full
  # per-branch secdb JSON (research/01 S30/S31).
  # UNPINNED PATH: the corpus records a last-update timestamp file and the
  # branch directories under the index, but not whether last-update sits at
  # the root or per branch. Confirm before enabling.
  - id: alpine-secdb
    url: https://secdb.alpinelinux.org/last-update
    enabled: true
    auth_mode: none
    sync_mechanism: conditional_get_last_modified
    interval_seconds: 86400
    freshness_slo_seconds: 259200
    on_failure: serve_stale
    license_tier: 2
    license_spdx: CC-BY-SA-4.0
    license_manual_note: "Confirmed from the publisher's own license.txt at the secdb root (research/01 S31); the file itself is dated 2021-06-25. Share-alike: segregated mirror, own LICENSE, never merged."
    mirror_dir: alpine
    bootstrap_url: https://secdb.alpinelinux.org/
    bootstrap_mechanism: bulk_archive

  # OSV merged aggregate. THIS IS THE OTHER BRANCH of the Feed Table's OSV
  # row: pulled as one merged archive it is contaminated with CC-BY-SA-4.0 via
  # the bundled Ubuntu source, so the whole artifact inherits share-alike and
  # lands in Tier 2. Shipped disabled — prefer the per-ecosystem rows above,
  # which keep their own licences and their own tiers.
  - id: osv-merged
    url: https://storage.googleapis.com/osv-vulnerabilities/all.zip
    enabled: false
    auth_mode: none
    sync_mechanism: conditional_get_last_modified
    interval_seconds: 86400
    freshness_slo_seconds: 259200
    on_failure: serve_stale
    license_tier: 2
    license_spdx: NOASSERTION
    license_manual_note: "The aggregate has no unified licence: sources are CC-BY-4.0, CC0-1.0, MIT, BSD, Apache-2.0 and CC-BY-SA-4.0 depending on origin (research/06 S14, research/01 S7). Merged, it inherits the strictest — CC-BY-SA-4.0 via Ubuntu — so it is Tier 2 as a whole."
    mirror_dir: osv
    bootstrap_mechanism: bulk_archive

  # -------------------------------------------------------------------------
  # TIER 3 — optional, user opt-in at install time, risk-accepted
  # -------------------------------------------------------------------------

  # EPSS. NO LICENCE EXISTS. Not "permissive", not "public domain", not
  # "open": research/01 S18/S19 record no licence document and no SPDX
  # identifier, and attribution being *requested* is not a grant of rights.
  # Shipped disabled; never load-bearing for any verdict; on_failure
  # disable_feed is legal here precisely because its absence changes nothing.
  # The loader refuses license_spdx NONE at any tier other than 3.
  - id: epss
    url: https://epss.empiricalsecurity.com/epss_scores-current.csv.gz
    enabled: false
    auth_mode: none
    sync_mechanism: conditional_get_last_modified
    interval_seconds: 86400
    freshness_slo_seconds: 259200
    on_failure: disable_feed
    license_tier: 3
    license_spdx: NONE
    license_manual_note: "No licence document and no SPDX identifier (research/01 S18/S19). The publishers state only that \"EPSS scores are published daily, free of charge, with no registration required\" (research/06 S17); attribution is requested, which is not a grant of rights. Optional, opt-in, risk-accepted — Anvil must never describe EPSS as open licensed."
    bootstrap_mechanism: bulk_archive
