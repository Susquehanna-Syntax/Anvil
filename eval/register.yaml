experiments:

  # =========================================================================
  # KILL CRITERION #1
  # =========================================================================
  - id: EXP-01
    name: Advisory-permutation ablation (Test 4)
    kind: experiment
    spine_ref: S3.1
    source_ref: >-
      research/03-detection-training-data-and-method.md — "Evaluation harness" table, Test 4 row;
      enumerated as experiment #1 in research/14-critique-and-gaps.md B7 table
    owner_step: M0.9
    status: not_started
    decision_gated: >-
      Whether the detection model actually reads the advisory, i.e. whether advisory-conditioning is
      real. PASS: proceed with the three-tier design (research/02) using this candidate model.
      FAIL: kill criterion #1 — CVE ingestion is decoration (plan/00-SPINE.md S3.1); delete
      advisory-text conditioning from the SAST adjudicator's design, restrict advisory text to the
      narrow vendored/backported-code scope only (S1 corrected requirement #8; research/14 B2 fix),
      and re-evaluate whether Tier 3 should exist at all pending EXP-02.
    corpus:
      - name: PrimeVul-Paired
        licence: MIT
        licence_ref: >-
          research/03-detection-training-data-and-method.md S2, via
          plan/10-milestone0-evaluation.md "## Pinned Versions And Licences"
      - name: Qwen/Qwen3.5-2B (primary candidate)
        licence: Apache-2.0 — pending text-only-variant confirmation (M0.6/M0.8)
        licence_ref: plan/10-milestone0-evaluation.md "## Pinned Versions And Licences"
      - name: Gemma-4 (specific variant TBD, secondary candidate)
        licence: >-
          Apache-2.0 for the specific variant only — re-verify per-variant, do not infer from the
          family-level reversal
        licence_ref: >-
          plan/00-SPINE.md S4 caveat, via plan/10-milestone0-evaluation.md
          "## Pinned Versions And Licences"
    method: >-
      Substitute an unrelated advisory for the correct one and measure the EXHIBITS ->
      DOES_NOT_EXHIBIT verdict flip rate over PrimeVul-Paired. Run against Qwen3.5-2B (primary) and
      Gemma-4 (secondary) and report per-model breakdown, not a single aggregate — the two candidates
      may diverge and that divergence is itself model-selection evidence. The permutation must be
      drawn from the full advisory pool, never a CWE-matched subset (a CWE-matched subset understates
      the true flip rate and biases toward a false PASS; M0.12 critic gate).
    metric: >-
      Flip rate (EXHIBITS -> DOES_NOT_EXHIBIT) on the PrimeVul-Paired test split, reported with a
      bootstrap 95% confidence interval — n_pairs is only 564, so CI width matters at this sample size.
    threshold_pass: >-
      Flip rate > 80% (plan/00-SPINE.md S3.1; research/03-detection-training-data-and-method.md
      Test 4 row).
    threshold_fail: >-
      Flip rate < 50% (plan/00-SPINE.md S3.1) — CVE ingestion is decoration. The 50-80% band is
      AMBIGUOUS; PROPOSED handling is to run the QLoRA runner-up (research/03) before a final call,
      and plan/10-milestone0-evaluation.md "## Open Questions" requires M0.18's orchestrator to set an
      explicit escalation policy for this band before it can occur in practice.
    reference_baseline: >-
      research/03-detection-training-data-and-method.md — "Evaluation harness" table, Test 4 row
      (bar: > 80% flip rate)
    result:
      value: null
      unit: null
      measured_at: null
      artifact_path: null
    decision: UNRESOLVED
    depends_on: []
    deferred_reason: null
    owning_future_phase: null

  # =========================================================================
  # KILL CRITERION #2
  # =========================================================================
  - id: EXP-02
    name: Code-metrics logistic-regression baseline
    kind: experiment
    spine_ref: S3.2
    source_ref: >-
      research/02-small-detection-models.md finding B / S3 (arXiv:2509.19117);
      enumerated as experiment #2 in research/14-critique-and-gaps.md B7 table
    owner_step: M0.10
    status: not_started
    decision_gated: >-
      Whether the small-model detection tier should exist at all. PASS (logistic regression is
      significantly worse than the model on both metrics — non-overlapping CIs, LR lower): the model
      tier is justified. FAIL: kill criterion #2 — the model tier does not exist (plan/00-SPINE.md
      S3.2); delete Tier 3 (small-model adjudicator) entirely and ship Tier 1 (deterministic
      pre-filter) plus optional Tier 2 (encoder ranker, or the LR itself) only — research/02's
      three-tier design demoted to two.
    corpus:
      - name: PrimeVul / PrimeVul-Paired
        licence: MIT
        licence_ref: >-
          research/03-detection-training-data-and-method.md S2, via
          plan/10-milestone0-evaluation.md "## Pinned Versions And Licences"
      - name: Qwen/Qwen3.5-2B (model arm, shared with EXP-01)
        licence: Apache-2.0 — pending text-only-variant confirmation (M0.6/M0.8)
        licence_ref: plan/10-milestone0-evaluation.md "## Pinned Versions And Licences"
    method: >-
      Train a logistic regression over classic code metrics (cyclomatic complexity, LoC, nesting
      depth, etc.; full feature list recorded for reproducibility) on PrimeVul and score it against
      the small model's arm on the identical held-out split and identical metric definitions used by
      EXP-01, so the comparison is apples-to-apples. Two hard constraints: the LR must not be trained
      on the paired test split used for evaluation (no leakage), and the training set must not be
      class-balanced — research/03 and research/14 (S14 citation) both name balanced training as the
      specific failure mode that manufactures false confidence (the 0.09-precision catastrophe).
      Both arms reported with bootstrap CIs.
    metric: >-
      Test-1 pairwise-correct (P-C) rate and Test-2 precision at recall 0.70, computed for both the
      LR arm and the model arm, each with a bootstrap 95% confidence interval.
    threshold_pass: >-
      The LR is significantly worse than the small model on BOTH metrics — non-overlapping 95% CIs
      with the LR lower. PROPOSED — no published Anvil-specific equivalence margin exists
      (research/02-small-detection-models.md S3, arXiv:2509.19117; plan/00-SPINE.md S3.2).
    threshold_fail: >-
      The LR's Test-1 P-C and Test-2 precision-at-recall-0.70 fall within or exceed the small model's
      95% CI. Note plan/10-milestone0-evaluation.md "## Open Questions": this equivalence margin is an
      engineering judgment call, not a citation — the statistical protocol (sample size, CI method)
      must be confirmed before EXP-02 runs.
    reference_baseline: >-
      research/03-detection-training-data-and-method.md — "Evaluation harness" table: Test 1 bar
      P-C > 25% with reference GPT-4 CoT 12.94%; Test 2 bar F1 > 5.22% (flag-everything) with
      reference best fine-tune 5.82%
    result:
      value: null
      unit: null
      measured_at: null
      artifact_path: null
    decision: UNRESOLVED
    depends_on:
      - EXP-01
    deferred_reason: null
    owning_future_phase: null

  # =========================================================================
  - id: EXP-03
    name: llama-bench prefill on real hardware
    kind: experiment
    spine_ref: S2, S9
    source_ref: >-
      research/02-small-detection-models.md S8 and research/05-inference-serving-and-hardware.md;
      enumerated as experiment #3 in research/14-critique-and-gaps.md B7 table
    owner_step: M0.11
    status: not_started
    decision_gated: >-
      Every downstream compute claim in the plan. PASS: S2's ~17 min / ~2 min budget and S9's tier
      assignments stand as written. FAIL: re-derive the candidates-per-scan ceiling from INSTR-01's
      measured count against the actual throughput; if the recomputed wall-clock exceeds S2's budget,
      drop to Qwen3.5-0.8B, move Tier 3 to the encoder-only ranker (research/02 flip condition #2),
      or raise the minimum hardware tier for the detection path.
    corpus:
      - name: Qwen/Qwen3.5-2B (primary candidate)
        licence: Apache-2.0 — pending text-only-variant confirmation (M0.6/M0.8)
        licence_ref: plan/10-milestone0-evaluation.md "## Pinned Versions And Licences"
      - name: Gemma-4 (specific variant TBD, secondary candidate)
        licence: Apache-2.0 for the specific variant only — re-verify per-variant
        licence_ref: >-
          plan/00-SPINE.md S4 caveat, via plan/10-milestone0-evaluation.md
          "## Pinned Versions And Licences"
      - name: HuggingFaceTB/SmolLM3-3B (auditability runner-up)
        licence: Apache-2.0
        licence_ref: research/02-small-detection-models.md S13
      - name: llama-bench (ggml-org/llama.cpp, pinned release tag)
        licence: MIT
        licence_ref: plan/10-milestone0-evaluation.md "## Pinned Versions And Licences"
    method: >-
      llama-bench prefill sweep for each candidate model at realistic pair-prompt length (~2,000
      tokens: ~800 advisory/CWE text + ~1,000 code chunk + ~200 instruction), on whatever S9 hardware
      tier is actually available, recorded against the tier it represents. Raw llama-bench output log
      retained and the quantisation level used (Q4_K_M or otherwise) recorded — the corpus's own
      "<1% quality loss for Q4" claim is itself flagged unverified for Anvil's exact task
      (research/02 Risks). No extrapolation from another model family's numbers: the entire point is
      that no Qwen3.5/Gemma-4 CPU throughput number has been measured anywhere in the corpus.
    metric: >-
      Prefill throughput in tokens/second at a 2,000-token prompt — this is the headline number,
      because Anvil is prefill-bound (research/02 S8, research/14 B1). Generation throughput is
      recorded but is explicitly NOT the headline.
    threshold_pass: >-
      Measured prefill >= 600 tok/s on Tier-S hardware for the ~2B candidate. PROPOSED, informed by
      published scaling: the non-generous parameter-scaled estimate in research/14-critique-and-gaps.md
      B1, scaling research/02 S8's measured 170 tok/s at 7B. (The "2,000 tok/s" figure used elsewhere
      in the corpus is explicitly "a 3.3x gift to the design" and is not the bar.)
    threshold_fail: >-
      Measured prefill < 600 tok/s on Tier-S for the ~2B candidate — triggers the re-derivation of
      the candidates-per-scan ceiling described in decision_gated.
    reference_baseline: >-
      research/02-small-detection-models.md S8 (Malakhov, CEUR-WS Vol-4164) — the measured statement
      is "a 256-token prompt was about 6.5 s on E5-2695 v2 for a 7B model, 1.5 s on the new Xeon, and
      3 s on the laptop". The "~170 tok/s prefill at 7B" figure is the arithmetic derivation
      (256 tok / 1.5 s), not a number printed in the source; the "Xeon Platinum 8480+" SKU is named by
      plan/10-milestone0-evaluation.md, not by research/02, which says only "the new Xeon".
    result:
      value: null
      unit: null
      measured_at: null
      artifact_path: null
    decision: UNRESOLVED
    depends_on: []
    deferred_reason: null
    owning_future_phase: null

  # =========================================================================
  - id: EXP-04
    name: Open-weight vs. frontier patch quality (ARVO / CWE-Bench-Java)
    kind: experiment
    spine_ref: S3, S7
    source_ref: >-
      research/10-prior-art-and-landscape.md, research/04-remediation-coding-model.md and
      research/11-fix-validation-and-false-positives.md S7; enumerated as experiment #4 in
      research/14-critique-and-gaps.md B7 table
    owner_step: M0.16
    status: not_started
    decision_gated: >-
      Anvil's claimed central differentiator — the "possibly better system" framing in
      plan/00-SPINE.md S3. PASS: the framing is supported; no redesign forced, since S7's
      never-auto-merge posture already assumes a low verified-fix rate. FAIL: the coding-agent tier
      needs a larger or different open-weight model, or the differentiator claim in project messaging
      should be revised. Either way this does not change the safety posture — S7 already mandates
      human review regardless of rate.
    corpus:
      - name: ARVO (n132/ARVO repo commit SHA + specific n132/arvo:<id>-vul Docker tags)
        licence: BSD-2-Clause
        licence_ref: >-
          research/16-fuzzing-and-dynamic-analysis.md S2/S25 — cite only the canonical 2024-08 paper
          (arXiv:2408.02153); the 2026 posting is withdrawn
      - name: CWE-Bench-Java (iris-sast/cwe-bench-java commit SHA)
        licence: MIT
        licence_ref: plan/spine-b-open-licences.md section 7
      - name: Qwen/Qwen3-Coder-Next (coding-agent arm)
        licence: Apache-2.0
        licence_ref: >-
          research/14-critique-and-gaps.md "Held up exactly" table (79.7B params, 512 experts,
          10 active)
    method: >-
      Run the open-weight coding agent over the sampled ARVO and CWE-Bench-Java subsets using the
      AutoPatchBench-style three-stage validation gate (crash input no longer crashes -> 10-minute
      fuzz survival -> differential behaviour check) and ARVO's reproduce() contract. The frontier
      comparison arm is taken from published literature, never re-run: plan/00-SPINE.md S0 requires
      self-hosted open-weight models only, so no proprietary frontier API is called. The exploit
      oracle (research/11 gate 9) is mandatory — a patch is never counted "fixed" on test-suite pass
      alone, because research/11's Vul4J finding is that 10.3% of patches pass tests while remaining
      exploitable, and ARVO itself found 300+ falsely-patched still-active vulnerabilities in
      OSS-Fuzz's own "fixed" set. Upstream "fixed" labels are never trusted as ground truth.
    metric: >-
      Verified-fix rate per corpus (fraction of cases clearing all three gates with a recorded
      exploit-oracle re-execution), plus generation success rate and the full gate-failure breakdown
      (compile_fail, test_fail, exploit_still_triggers, deceptive_pass) — never an aggregate
      percentage alone.
    threshold_pass: >-
      Verified-fix rate >= 5% on ARVO, matching or exceeding Gemini 1.5 Pro's AutoPatchBench-verified
      5.3%. PROPOSED — derived by analogy, not a number published for Qwen3-Coder-Next specifically;
      plan/10-milestone0-evaluation.md "## Open Questions" requires explicit sign-off before this
      drives any messaging claim.
    threshold_fail: >-
      Verified-fix rate < 2% on ARVO. PROPOSED, same caveat as threshold_pass.
    reference_baseline: >-
      research/11-fix-validation-and-false-positives.md S7 — AutoPatchBench: Gemini 1.5 Pro 61.1%
      generation / 5.3% fully-verified; supporting context research/16-fuzzing-and-dynamic-analysis.md
      S18 (DARPA AIxCC 68% of synthetic vulnerabilities patched, ~$152/task) and plan/00-SPINE.md S7
      ("Best measured security-patch rate on real CVEs is 34.0%")
    result:
      value: null
      unit: null
      measured_at: null
      artifact_path: null
    decision: UNRESOLVED
    depends_on: []
    deferred_reason: null
    owning_future_phase: null

  # =========================================================================
  # PERMANENT INSTRUMENT — not a kill gate
  # =========================================================================
  - id: INSTR-01
    name: Candidates-per-scan (permanent instrument)
    kind: instrumentation
    spine_ref: S2
    source_ref: >-
      plan/00-SPINE.md S2 ("Instrument it on day one"); research/14-critique-and-gaps.md B1
      and its "Suggested fix"
    owner_step: M0.14
    status: not_started
    decision_gated: >-
      The single number plan/00-SPINE.md S2 says decides whether Anvil is affordable at all — "it,
      not model size, determines feasibility". PASS: affordability confirmed at the current
      recall-tier tuning; carry the measured count into Milestone 1's scheduler design. FAIL:
      re-scope the recall tier — narrower rules, CWE-class routing, or tighter version-range matching
      (research/14-critique-and-gaps.md B1 "Suggested fix") — before Milestone 1 proceeds. This row
      is a permanent instrument, not a kill gate; it is re-run, not retired.
    corpus:
      - name: AikidoSec/opengrep-rules (pinned commit SHA, diffed before any future promotion)
        licence: MIT
        licence_ref: research/14-critique-and-gaps.md M6
      - name: opengrep engine (pinned release version, subprocess invocation only)
        licence: LGPL-2.1
        licence_ref: plan/00-SPINE.md S4
    method: >-
      A re-runnable instrument (a standalone callable, never a throwaway script or notebook cell —
      S2 asks for a permanent day-one measurement) that runs pinned opengrep plus
      AikidoSec/opengrep-rules against a target repo and counts candidates emitted per full scan and
      per push. Exercised in M0 against at least 3 structurally different sample repos (e.g. a small
      CLI tool, a web-app-shaped repo, a library) so the count is not an artifact of one repo's shape.
    metric: >-
      candidates_full_scan and candidates_per_push per target repo, recorded together with the
      ruleset commit SHA.
    threshold_pass: >-
      Fewer than 500 candidates per full scan AND fewer than 50 per push (plan/00-SPINE.md S2, exact
      figures) — at which the model tier costs ~17 min and ~2 min respectively.
    threshold_fail: >-
      Counts "in the thousands" (plan/00-SPINE.md S2) — the design does not work as written and must
      be re-scoped.
    reference_baseline: >-
      research/14-critique-and-gaps.md B1, restating plan/00-SPINE.md S2's figures: < 500 per full
      scan and < 50 per push
    result:
      value: null
      unit: null
      measured_at: null
      artifact_path: null
    decision: UNRESOLVED
    depends_on: []
    deferred_reason: null
    owning_future_phase: null

  # =========================================================================
  - id: S12-RTT
    name: Encoder HTTP round-trip under realistic pair volume
    kind: experiment
    spine_ref: S12
    source_ref: >-
      plan/00-SPINE.md S12 — the recorded counter-argument to the Go control-plane pick: "Measure
      encoder RTT under realistic pair volume during Milestone 0 before this is irreversible"
    owner_step: M0.15
    status: not_started
    decision_gated: >-
      Whether S12's Go-for-the-control-plane pick survives contact with a measured number. PASS: the
      pick is confirmed; no action needed. FAIL: record as a "Conflict With Spine" item for the
      orchestrator — collapsing the encoder and the orchestrator into one Python process becomes the
      stronger pick per S12's own stated counter-argument. Note that M0 only produces the number; per
      plan/10-milestone0-evaluation.md "## Conflicts With Spine" the resulting decision belongs to
      whichever future step owns S12, not to M0.
    corpus:
      - name: microsoft/unixcoder-base (Tier-2 encoder candidate)
        licence: Apache-2.0 weights / MIT repo
        licence_ref: research/02-small-detection-models.md S18
      - name: ONNX Runtime (pinned release version, encoder worker)
        licence: MIT
        licence_ref: plan/10-milestone0-evaluation.md "## Pinned Versions And Licences"
    method: >-
      Serve the Tier-2 encoder candidate via ONNX Runtime as a separate always-on process addressed
      over HTTP — never an in-process library call, since the in-process case is exactly what S12
      forbids and measuring it would answer the wrong question — and measure aggregate round-trip
      time across a realistic pair volume ("thousands of advisory x code-chunk pairs per scan", S12's
      own framing), at a pair count at least as large as INSTR-01's measured candidates-per-scan for
      the sample repos used. The pair count and its relationship to INSTR-01's number must be stated
      explicitly so the overhead-fraction calculation is traceable.
    metric: >-
      Total RTT (seconds) and RTT per pair (ms) at the measured pair count, expressed as a fraction
      of the per-scan model-tier wall clock derived from EXP-03's prefill throughput x INSTR-01's
      candidate count.
    threshold_pass: >-
      Aggregate encoder overhead <= 20% (PROPOSED) of the per-scan model-tier wall clock established
      by EXP-03 x INSTR-01.
    threshold_fail: >-
      Aggregate encoder overhead > 20% (PROPOSED) of that wall clock. The spine explicitly calls this
      "a cost never measured" (plan/00-SPINE.md S12), so the 20% figure is an engineering proposal,
      not a sourced bar.
    reference_baseline: PROPOSED — no published baseline
    result:
      value: null
      unit: null
      measured_at: null
      artifact_path: null
    decision: UNRESOLVED
    depends_on:
      - EXP-03
      - INSTR-01
    deferred_reason: null
    owning_future_phase: null

