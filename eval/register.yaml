  - id: encoder-round-trip
    name: Encoder HTTP round-trip under realistic pair volume
    kind: experiment
    spine_ref: the spine's Go control-plane decision
    source_ref: >-
      the spine's Go control-plane decision — the recorded counter-argument to the Go control-plane pick: "Measure
      encoder RTT under realistic pair volume during Milestone 0 before this is irreversible"
    owner_node: costs
    status: complete
    decision_gated: >-
      Whether the spine's Go-for-the-control-plane pick survives contact with a measured number. PASS: the
      pick is confirmed; no action needed. FAIL: record as a "Conflict With Spine" item for the
      orchestrator — collapsing the encoder and the orchestrator into one Python process becomes the
      stronger pick per the spine's own stated counter-argument. Note that the evaluation milestone only produces the number; per
      plan/design/evaluation.md "## Conflicts With Spine" the resulting decision belongs to
      whichever later phase owns the spine's Go control-plane decision, not to the evaluation.
    corpus:
      - name: microsoft/unixcoder-base (Tier-2 encoder candidate)
        licence: Apache-2.0 weights / MIT repo
        licence_ref: research/02-small-detection-models.md S18
      - name: ONNX Runtime (pinned release version, encoder worker)
        licence: MIT
        licence_ref: plan/design/evaluation.md "## Pinned Versions And Licences"
    method: >-
      Serve the Tier-2 encoder candidate via ONNX Runtime as a separate always-on process addressed
      over HTTP — never an in-process library call, since the in-process case is exactly what the spine's Go control-plane decision
      forbids and measuring it would answer the wrong question — and measure aggregate round-trip
      time across a realistic pair volume ("thousands of advisory x code-chunk pairs per scan", the spine's
      own framing), at a pair count at least as large as the candidates-per-scan instrument's measured candidates-per-scan for
      the sample repos used. The pair count and its relationship to the candidates-per-scan instrument's number must be stated
      explicitly so the overhead-fraction calculation is traceable.
    metric: >-
      Total RTT (seconds) and RTT per pair (ms) at the measured pair count, expressed as a fraction
      of the per-scan model-tier wall clock derived from the prefill sweep's prefill throughput x the candidates-per-scan instrument's
      candidate count.
    threshold_pass: >-
      Aggregate encoder overhead <= 20% (PROPOSED) of the per-scan model-tier wall clock established
      by the prefill sweep x the candidates-per-scan instrument.
    threshold_fail: >-
      Aggregate encoder overhead > 20% (PROPOSED) of that wall clock. The spine explicitly calls this
      "a cost never measured" (the spine's Go control-plane decision), so the 20% figure is an engineering proposal,
      not a sourced bar.
    reference_baseline: PROPOSED — no published baseline
    result:
      value: 0.0119
      unit: "encoder round trip as a fraction of model-tier time per candidate (Tier S proxy)"
      measured_at: "2026-10-03"
      artifact_path: "eval/results/encoder-round-trip.json"
    decision: PASS
    depends_on:
      - prefill-sweep
      - candidates-per-scan
    deferred_reason: null
    owning_future_phase: null

