# Anvil — Milestone 0 experiment register
#
# Authored by the experiment register (plan/design/evaluation.md lines 33-58).
# Field list: plan/design/evaluation.md "## Experiment Register Schema".
# Row content: plan/design/evaluation.md "## Go/No-Go Decision Table".
# Validates against: eval/schema/register.schema.json
#
# ---------------------------------------------------------------------------
# HOW TO READ THE `decision` FIELD — read this before acting on any row.
#
#   `decision: UNRESOLVED`  means NOBODY HAS DECIDED YET. It is NOT a pass.
#                           It is NOT a "probably fine". It is the absence of
#                           a decision, stated out loud.
#
# Every row in this file is born UNRESOLVED and stays UNRESOLVED until an
# orchestrator-inline step writes PASS / FAIL / AMBIGUOUS / DEFERRED into it.
# There is no null, no empty string and no missing-key representation of an
# undecided row — the schema forbids all three — precisely so that a row whose
# decision was never recorded cannot be skimmed as if it had passed.
#
# Worker packets populate `result` only. They NEVER touch `decision`.
# (plan/design/evaluation.md, note under "## Experiment Register Schema":
#  "`decision` is only ever set by an orchestrator-inline step ... never by a
#  worker packet".)
#
# The advisory-permutation ablation and the code-metrics baseline are the two
# kill criteria (the spine's two kill criteria). The gate decision reads their
# rows and decides whether Anvil's small-model detection tier exists at all. If
# either row still reads UNRESOLVED, the gate decision has no input and no
# Milestone-1 component-build packet may be dispatched.
# ---------------------------------------------------------------------------
#
# STATE AT AUTHORING (the experiment register): nothing has been run.
#   - 14/14 rows        decision: UNRESOLVED
#   - 6 rows            status: not_started   (advisory permutation, code-metrics baseline,
#                                               prefill sweep, patch quality, candidates per
#                                               scan, encoder round trip)
#   - 8 rows            status: deferred      (the eight deferred experiments)
#   - 14/14 rows        result: all fields null
#   - `owning_future_phase` is null on every deferred row. The register roll-up owns
#     populating it; the evaluation exit gate requires it non-null before evaluation
#     closes. Null here means "not yet assigned", not "no owner needed".

# PRE-REGISTRATION (2026-10-03, Phase 5, before any experiment ran):
#   - advisory-permutation and code-metrics-baseline carry their pass, fail and
#     ambiguity policies, their sample sizes and their interval rules in
#     method / metric / threshold_pass / threshold_fail. The commit that wrote
#     them precedes every file under eval/results/; `git log -- eval/register.yaml`
#     is the evidence.
#   - Owner decisions folded in on 2026-10-03: the recall corpus is the
#     federation (candidates-per-scan), and ARVO is dropped for now
#     (later that day the owner allowed ARVO for local-only patch-quality testing)
#     (patch-quality).
#   - Every deferred row names its owning phase.
#   - `decision` is still UNRESOLVED on all fourteen rows. Only the owner sets it.
#
# RESULTS AND THE GATE (2026-10-03, Phase 5): five rows ran and are complete,
# each with its artifact under eval/results/. The owner set their decisions by
# the pre-registered bands and decided the gate (the `gate` block below).
# patch-quality is deferred to Phase 7 by the owner; eight rows stay deferred.
#
# PHASE 6 (2026-10-03): candidates-per-scan was re-run through Lane B itself (anvil recall) on the
# owner's selection of that day (data/rules/selection.json): largest full scan 225 (curl, was
# 10,714), largest push 27 (Anvil, was 88), under both bars. The row's decision is still the one
# the owner set on the old number; only the owner changes it.

version: 1

# ===========================================================================
# THE GATE DECISION (plan node gate). Decided by the owner on 2026-10-03 and
# written here at the owner's instruction, with the numbers it rests on.
# ===========================================================================
gate:
  decided_on: "2026-10-03"
  decided_by: the owner
  outcome: SHRINK
  decision: >-
    Shrink the model tier to recall plus an optional ranker. The adjudicator and advisory-text
    conditioning are deleted. Lane B ships the recall federation; a ranker (the code-metrics
    regression or the unixcoder encoder) ships only if Phase 6 measures it beating chance on
    Anvil's own candidates, and no ranker is the default. Confirmation moves to the coding
    agent's triage gate.
  flip_rate: >-
    advisory-permutation, CWE-text framing (decides): Qwen3.5-2B 0.500 [0.407, 0.590], 57 flips
    of 114 real-advisory exhibits over 393 pairs; Gemma-4-E2B-it 0.900 [0.750, 1.000], 18 of 20.
    Both intervals cross a band edge, so the pre-registered reading is ambiguous twice, a FAIL
    for v1. CVE-text framing (reported): Qwen3.5-2B 0.842 [0.766, 0.913], Gemma-4-E2B-it 1.000
    [1.000, 1.000]. 95% percentile bootstrap, 10,000 resamples, seed 20261003.
  baseline_comparison: >-
    code-metrics-baseline, CWE-text framing, model arm Qwen3.5-2B, 393 pairs, paired resamples:
    pairwise-correct 0.031 [0.015, 0.048] against the regression's 0.005 [0.000, 0.013] (model
    clearly better, by 0.002); precision at recall 0.70 0.498 [0.488, 0.511] against 0.492
    [0.487, 0.499] (overlap; both at chance, 0.5). One clear metric of two is AMBIGUOUS. The
    equivalence rule is an engineering judgement, not a citation.
  consequences: >-
    Lane B (Phase 6) builds the recall federation, the candidate contract, the candidates-per-scan
    metric and the pipeline that places recall findings on the record; it does not build the
    adjudicator, its llama-server residency or its KL-divergence gate. The candidate volume must
    be narrowed first (10,714 on curl's full scan against 500). The record's verdict, reasoning and
    confidence slots for Lane B findings are settled at the contract freeze.

experiments:

  # =========================================================================
  # KILL CRITERION #1
  # =========================================================================
  - id: advisory-permutation
    name: Advisory-permutation ablation (Test 4)
    kind: experiment
    spine_ref: the first kill criterion
    source_ref: >-
      research/03-detection-training-data-and-method.md — "Evaluation harness" table, Test 4 row;
      enumerated as experiment #1 in research/14-critique-and-gaps.md B7 table
    owner_node: ablation
    status: complete
    decision_gated: >-
      Whether the detection model actually reads the advisory, i.e. whether advisory-conditioning is
      real. PASS: proceed with the three-tier design (research/02) using this candidate model.
      FAIL: kill criterion #1 — CVE ingestion is decoration (the first kill criterion); delete
      advisory-text conditioning from the SAST adjudicator's design, restrict advisory text to the
      narrow vendored/backported-code scope only (the spine's corrected requirement 8; research/14 B2 fix),
      and re-evaluate whether Tier 3 should exist at all pending the code-metrics baseline.
    corpus:
      - name: PrimeVul-Paired
        licence: MIT
        licence_ref: >-
          research/03-detection-training-data-and-method.md S2, via
          plan/design/evaluation.md "## Pinned Versions And Licences"
      - name: Qwen/Qwen3.5-2B at 15852e8c16360a2fea060d615a32b45270f8a8fc (primary candidate)
        licence: >-
          Apache-2.0, read from the repository's LICENSE body at that revision on 2026-10-03. No
          text-only repository exists; llama.cpp serves the language model without a vision projector
        licence_ref: eval/src/anvil_eval/models.py, the candidate catalogue (evidence pinned by git blob hash)
      - name: google/gemma-4-E2B-it at 3e22461f65e89153144f8adb70e3b8c2cc9845a7 (second candidate)
        licence: >-
          Apache-2.0, read from the model card's own text at that revision on 2026-10-03 (the
          repository has no LICENSE file); the card links Google's Gemma 4 licence page, which held
          the Apache 2.0 text that day
        licence_ref: eval/src/anvil_eval/models.py, the candidate catalogue (evidence pinned by git blob hash)
      - name: CWE 4.20 catalogue (cwec_v4.20.xml.zip, MITRE), the CWE-text framing
        licence: MITRE CWE Terms of Use (attribution)
        licence_ref: mirror/tier0/LICENSE-NOTES.md "CWE 4.20"
      - name: llama.cpp b11146 (commit 7fe450e19305b828c199d602c23a8337aaa1f03b), llama-server
        licence: MIT
        licence_ref: the LICENSE body shipped in the b11146 release archive, read 2026-10-03
    method: >-
      Pre-registered 2026-10-03, before any run. Corpus: PrimeVul v0.1, primevul_test_paired.jsonl,
      every pair whose vulnerable and patched functions are each at most 12,000 characters (one
      model-independent length rule, shared with the code-metrics baseline; the excluded count is
      reported). The map expects 564 pairs; the loader records the count it finds. No other
      subsampling. For each pair the vulnerable function is judged twice in each framing: with its
      real advisory, and with an unrelated advisory drawn uniformly at random (seed 20261003) from
      the full pool of the other pairs' advisories, never a CWE-matched subset; a draw whose text is
      identical to the real advisory is redrawn. Two framings: CVE text (the pair's cve_desc; pairs
      without one are left out of this framing and counted) and CWE text (the name and description
      of the pair's first CWE from the CWE 4.20 catalogue; pairs whose CWE is missing, NVD-CWE-Other
      or NVD-CWE-noinfo are left out of this framing and counted). Each candidate is served by
      llama-server from llama.cpp b11146 as a Q4_K_M GGUF converted from its pinned revision,
      temperature 0, fixed seed, with grammar-constrained JSON whose verdict is exhibits,
      does_not_exhibit or insufficient_context. Both candidates run in the same pass, Qwen3.5-2B
      (primary) and Gemma-4-E2B-it (second), and each is reported separately. Command and pins are
      in the result artifact.
    metric: >-
      Flip rate, per candidate and per framing: among pairs whose real-advisory verdict is exhibits,
      the share whose permuted-advisory verdict is does_not_exhibit. A move to insufficient_context
      is not a flip; its rate is reported beside it. 95% percentile bootstrap interval, 10,000
      resamples of pairs, seed 20261003. The interval is reported, never the point estimate alone.
    threshold_pass: >-
      Pre-registered 2026-10-03, before any run. The Lane-B-shaped number (CWE text) decides; the
      CVE-text number is reported beside it. PASS when the primary candidate's 95% interval lies
      wholly above 80%. Reading the band from the interval rather than the point estimate is an
      engineering judgement: it can only make a pass harder.
    threshold_fail: >-
      Pre-registered 2026-10-03, before any run. FAIL when the primary candidate's interval lies
      wholly below 50%: advisory-text conditioning is deleted and the tier's fate goes to the
      code-metrics baseline. Any other interval (inside 50-80%, or crossing 50% or 80%) is AMBIGUOUS: the
      second candidate's result, from the same pass, is read by the same rule. If it passes, the
      gate proceeds with the second candidate; otherwise the outcome is treated as FAIL for v1.
    reference_baseline: >-
      research/03-detection-training-data-and-method.md — "Evaluation harness" table, Test 4 row
      (bar: > 80% flip rate)
    result:
      value: 0.5
      unit: "flip rate, CWE-text framing, Qwen3.5-2B (interval, both framings and both candidates in the artifact)"
      measured_at: "2026-10-03"
      artifact_path: "eval/results/advisory-permutation.json"
    decision: FAIL
    depends_on: []
    deferred_reason: null
    owning_future_phase: null

  # =========================================================================
  # KILL CRITERION #2
  # =========================================================================
  - id: code-metrics-baseline
    name: Code-metrics logistic-regression baseline
    kind: experiment
    spine_ref: the second kill criterion
    source_ref: >-
      research/02-small-detection-models.md finding B / S3 (arXiv:2509.19117);
      enumerated as experiment #2 in research/14-critique-and-gaps.md B7 table
    owner_node: baseline
    status: complete
    decision_gated: >-
      Whether the small-model detection tier should exist at all. PASS (logistic regression is
      significantly worse than the model on both metrics — non-overlapping CIs, LR lower): the model
      tier is justified. FAIL: kill criterion #2 — the model tier does not exist (the second kill criterion); delete Tier 3 (small-model adjudicator) entirely and ship Tier 1 (deterministic
      pre-filter) plus optional Tier 2 (encoder ranker, or the LR itself) only — research/02's
      three-tier design demoted to two.
    corpus:
      - name: PrimeVul / PrimeVul-Paired
        licence: MIT
        licence_ref: >-
          research/03-detection-training-data-and-method.md S2, via
          plan/design/evaluation.md "## Pinned Versions And Licences"
      - name: >-
          The model arm: Qwen/Qwen3.5-2B, or google/gemma-4-E2B-it if the advisory-permutation
          ambiguity rule moves to it (pins and licence evidence as in that row)
        licence: Apache-2.0 (both), read from each model's own text on 2026-10-03
        licence_ref: eval/src/anvil_eval/models.py, the candidate catalogue
      - name: CWE 4.20 catalogue (cwec_v4.20.xml.zip, MITRE), the CWE-text framing
        licence: MITRE CWE Terms of Use (attribution)
        licence_ref: mirror/tier0/LICENSE-NOTES.md "CWE 4.20"
      - name: llama.cpp b11146 (commit 7fe450e19305b828c199d602c23a8337aaa1f03b), llama-server
        licence: MIT
        licence_ref: the LICENSE body shipped in the b11146 release archive, read 2026-10-03
    method: >-
      Pre-registered 2026-10-03, before any run. Evaluation set: the advisory-permutation pairs
      (same length rule), both functions of each pair, each judged with the pair's real advisory in
      the CWE-text framing, which is Lane-B-shaped and decides; the CVE-text framing is reported,
      not decided on. Model arm: the candidate the advisory-permutation outcome proceeds with
      (Qwen3.5-2B unless the ambiguity rule moved to Gemma-4-E2B-it). Its verdict exhibits counts as
      vulnerable; does_not_exhibit and insufficient_context count as not vulnerable. Its ranking
      score is the probability of the exhibits verdict, read from the raw next-token distribution at
      the verdict's first token and normalised over the three verdicts' first tokens; it is an
      evaluation-only measurement, and Anvil's verdict schema carries no score. Regression arm:
      logistic regression (L2, C = 1, features standardised on the training set, no class weighting,
      no rebalancing) over the classic metrics anvil_eval.metrics computes from the function text
      alone (non-blank lines, tokens, cyclomatic complexity, maximum nesting depth, parameters,
      calls, distinct callees, returns, loops, conditionals, pointer dereferences, array subscripts,
      Halstead volume, comment lines), trained on primevul_train.jsonl and never on a paired split.
      Its P-C threshold is the one that maximises P-C on primevul_valid_paired.jsonl.
    metric: >-
      Pairwise-correct rate (P-C: the vulnerable version predicted vulnerable and the patched
      version predicted not) and precision at recall 0.70 over the 2n functions (at the highest
      score threshold whose recall reaches 0.70), for both arms. 95% percentile bootstrap intervals,
      10,000 resamples of pairs, the same resample indices for both arms, seed 20261003. Sample
      size: every pair in the evaluation set, in one run with no stopping rule. Precision is
      measured at 50% prevalence because the set is paired, so a scorer that guesses has precision
      0.5; both arms see the same set.
    threshold_pass: >-
      Pre-registered 2026-10-03, before any run. PASS (the tier is justified) when on both metrics
      the regression's interval lies wholly below the model's: regression upper bound < model lower
      bound. The equivalence rule is an engineering judgement, not a citation; say so wherever the
      result is quoted.
    threshold_fail: >-
      Pre-registered 2026-10-03, before any run. FAIL (delete the adjudicator; ship recall plus an
      optional ranker, which may be the regression itself) when on both metrics the regression's
      interval overlaps or exceeds the model's: regression upper bound >= model lower bound. Clearly
      below on one metric and overlapping on the other is AMBIGUOUS and goes to the owner with all
      four intervals quoted. The equivalence rule is an engineering judgement, not a citation.
    reference_baseline: >-
      research/03-detection-training-data-and-method.md — "Evaluation harness" table: Test 1 bar
      P-C > 25% with reference GPT-4 CoT 12.94%; Test 2 bar F1 > 5.22% (flag-everything) with
      reference best fine-tune 5.82%
    result:
      value: 1
      unit: "metrics (of two) on which the model's 95% interval lies wholly above the regression's: 2 is PASS, 0 is FAIL, 1 is AMBIGUOUS (pre-registered)"
      measured_at: "2026-10-03"
      artifact_path: "eval/results/code-metrics-baseline.json"
    decision: AMBIGUOUS
    depends_on:
      - advisory-permutation
    deferred_reason: null
    owning_future_phase: null

  # =========================================================================
  - id: prefill-sweep
    name: llama-bench prefill on real hardware
    kind: experiment
    spine_ref: the spine's affordability and hardware-tier sections
    source_ref: >-
      research/02-small-detection-models.md S8 and research/05-inference-serving-and-hardware.md;
      enumerated as experiment #3 in research/14-critique-and-gaps.md B7 table
    owner_node: costs
    status: complete
    decision_gated: >-
      Every downstream compute claim in the plan. PASS: the spine's ~17 min / ~2 min budget and the spine's tier
      assignments stand as written. FAIL: re-derive the candidates-per-scan ceiling from the candidates-per-scan instrument's
      measured count against the actual throughput; if the recomputed wall-clock exceeds the spine's budget,
      drop to Qwen3.5-0.8B, move Tier 3 to the encoder-only ranker (research/02 flip condition #2),
      or raise the minimum hardware tier for the detection path.
    corpus:
      - name: Qwen/Qwen3.5-2B at 15852e8c16360a2fea060d615a32b45270f8a8fc (primary candidate)
        licence: >-
          Apache-2.0, read from the repository's LICENSE body at that revision on 2026-10-03. No
          text-only repository exists; llama.cpp serves the language model without a vision projector
        licence_ref: eval/src/anvil_eval/models.py, the candidate catalogue (evidence pinned by git blob hash)
      - name: google/gemma-4-E2B-it at 3e22461f65e89153144f8adb70e3b8c2cc9845a7 (second candidate)
        licence: >-
          Apache-2.0, read from the model card's own text at that revision on 2026-10-03 (the
          repository has no LICENSE file); the card links Google's Gemma 4 licence page, which held
          the Apache 2.0 text that day
        licence_ref: eval/src/anvil_eval/models.py, the candidate catalogue (evidence pinned by git blob hash)
      - name: HuggingFaceTB/SmolLM3-3B (auditability runner-up)
        licence: Apache-2.0
        licence_ref: research/02-small-detection-models.md S13
      - name: llama-bench (ggml-org/llama.cpp, pinned release tag)
        licence: MIT
        licence_ref: plan/design/evaluation.md "## Pinned Versions And Licences"
    method: >-
      llama-bench prefill sweep for each candidate model at realistic pair-prompt length (~2,000
      tokens: ~800 advisory/CWE text + ~1,000 code chunk + ~200 instruction), on whatever hardware the spine's hardware-tier table assigns
      tier is actually available, recorded against the tier it represents. Raw llama-bench output log
      retained and the quantisation level used (Q4_K_M or otherwise) recorded — the corpus's own
      "<1% quality loss for Q4" claim is itself flagged unverified for Anvil's exact task
      (research/02 Risks). No extrapolation from another model family's numbers: the entire point is
      that no Qwen3.5/Gemma-4 CPU throughput number has been measured anywhere in the corpus.
    metric: >-
      Prefill throughput in tokens/second at a 2,000-token prompt — this is the headline number,
      because Anvil is prefill-bound (research/02 S8, research/14 B1). Generation throughput is
      recorded but is explicitly NOT the headline.
    threshold_pass: >-
      Measured prefill >= 600 tok/s on Tier-S hardware for the ~2B candidate. PROPOSED, informed by
      published scaling: the non-generous parameter-scaled estimate in research/14-critique-and-gaps.md
      B1, scaling research/02 S8's measured 170 tok/s at 7B. (The "2,000 tok/s" figure used elsewhere
      in the corpus is explicitly "a 3.3x gift to the design" and is not the bar.)
    threshold_fail: >-
      Measured prefill < 600 tok/s on Tier-S for the ~2B candidate — triggers the re-derivation of
      the candidates-per-scan ceiling described in decision_gated.
    reference_baseline: >-
      research/02-small-detection-models.md S8 (Malakhov, CEUR-WS Vol-4164) — the measured statement
      is "a 256-token prompt was about 6.5 s on E5-2695 v2 for a 7B model, 1.5 s on the new Xeon, and
      3 s on the laptop". The "~170 tok/s prefill at 7B" figure is the arithmetic derivation
      (256 tok / 1.5 s), not a number printed in the source; the "Xeon Platinum 8480+" SKU is named by
      plan/design/evaluation.md, not by research/02, which says only "the new Xeon".
    result:
      value: 276.8
      unit: "tokens/s prefill at a 2000-token prompt, Qwen3.5-2B Q4_K_M, CPU with 4 threads (Tier S proxy); every arm in the artifact"
      measured_at: "2026-10-03"
      artifact_path: "eval/results/prefill-sweep.json"
    decision: FAIL
    depends_on: []
    deferred_reason: null
    owning_future_phase: null

  # =========================================================================
  - id: patch-quality
    name: Open-weight patch quality (ARVO, local only; CWE-Bench-Java)
    kind: experiment
    spine_ref: the spine's evaluate-first and safety sections
    source_ref: >-
      research/10-prior-art-and-landscape.md, research/04-remediation-coding-model.md and
      research/11-fix-validation-and-false-positives.md S7; enumerated as experiment #4 in
      research/14-critique-and-gaps.md B7 table
    owner_node: deferred
    status: deferred
    decision_gated: >-
      Anvil's claimed central differentiator — the "possibly better system" framing in
      the spine's evaluate-first rule. PASS: the framing is supported; no redesign forced, since the spine's
      never-auto-merge posture already assumes a low verified-fix rate. FAIL: the coding-agent tier
      needs a larger or different open-weight model, or the differentiator claim in project messaging
      should be revised. Either way this does not change the safety posture — the spine's safety section already mandates
      human review regardless of rate.
    corpus:
      - name: >-
          ARVO, local only: the generator n132/ARVO at bc2a373c6b32fb3d9e7f86c516b1844885dcec51,
          the dataset n132/ARVO-Meta (release v3.0.0, arvo.db, sha256
          331184ca807c2f136f98dac9f1df94c893f4ee2fdf9329dca517ff88e72f97ce) and the per-case
          n132/arvo:<id>-vul and <id>-fix Docker images
        licence: >-
          The generator is BSD-2-Clause (its LICENSE body, read 2026-10-03). The dataset and the
          images carry no licence. The owner allowed local-only use on 2026-10-03: nothing from ARVO
          is redistributed or committed, and no ARVO content is quoted in the repository.
        licence_ref: n132/ARVO's LICENSE body; n132/ARVO-Meta's tree (no LICENSE file) read 2026-10-03
      - name: CWE-Bench-Java (iris-sast/cwe-bench-java at afe0ebd0adc237abb46255f9cd479b1d71819136)
        licence: MIT
        licence_ref: the repository's LICENSE body (GitHub reports MIT; body to be archived at acquisition)
      - name: Qwen/Qwen3-Coder-30B-A3B-Instruct at b2cff646eb4bb1d68355c01b18ae02e7cf42d120 (coder)
        licence: Apache-2.0, read from the repository's LICENSE body at that revision on 2026-10-03
        licence_ref: eval/src/anvil_eval/models.py, the candidate catalogue
    method: >-
      ARVO is the oracle corpus, used locally only (the owner, 2026-10-03, after first dropping it
      the same day): each sampled case's n132/arvo:<id>-vul image rebuilds the vulnerable project
      with `arvo compile`, and `arvo` replays the fuzzer's crashing input, so a patch counts as
      verified-fixed only when that input no longer crashes; nothing from ARVO is committed or
      redistributed. CWE-Bench-Java has no oracle and reports build and test rates only. The loop
      (anvil_eval.patchloop) is generate, apply, build, test and, when a case has one, reproduce:
      the coder is served by llama-server from a Q4_K_M GGUF of the pinned revision and returns
      SEARCH/REPLACE blocks; the harness anchors and applies them; a case with an exploit oracle
      counts as verified-fixed only when the oracle no longer triggers. The loop is proven on a
      synthetic C case with a crash reproducer; the ARVO adapter is Phase 7's to build. The frontier
      comparison is taken from published literature, never re-run: no proprietary API is called.
    metric: >-
      Per corpus: generation rate, apply rate, build-pass rate and test-pass rate, and the
      verified-fix rate where an oracle exists, with the full failure breakdown (no_patch, apply_fail,
      build_fail, test_fail, exploit_still_triggers). Never an aggregate percentage alone. On
      CWE-Bench-Java the verified-fix rate is not measurable and is reported as such.
    threshold_pass: >-
      These bars apply to the verified-fix rate on ARVO (local only), the corpus with exploit
      oracles; they are unsigned and need the owner's sign-off. Verified-fix rate >= 5% on ARVO, matching or exceeding Gemini 1.5 Pro's AutoPatchBench-verified
      5.3%. PROPOSED — derived by analogy, not a number published for Qwen3-Coder-Next specifically;
      plan/design/evaluation.md "## Open Questions" requires explicit sign-off before this
      drives any messaging claim.
    threshold_fail: >-
      Verified-fix rate < 2% on ARVO. PROPOSED, same caveat as threshold_pass.
    reference_baseline: >-
      research/11-fix-validation-and-false-positives.md S7 — AutoPatchBench: Gemini 1.5 Pro 61.1%
      generation / 5.3% fully-verified; supporting context research/16-fuzzing-and-dynamic-analysis.md
      S18 (DARPA AIxCC 68% of synthetic vulnerabilities patched, ~$152/task) and the spine's safety section
      ("Best measured security-patch rate on real CVEs is 34.0%")
    result:
      value: null
      unit: null
      measured_at: null
      artifact_path: null
    decision: UNRESOLVED
    depends_on: []
    deferred_reason: >-
      Deferred to Phase 7 by the owner on 2026-10-03; Remediation owns the coder and the validation
      ladder. The owner then allowed ARVO for local-only use, so Phase 7 measures a real
      verified-fix rate on it. Running it needs Docker (not installed on 2026-10-03), the ARVO
