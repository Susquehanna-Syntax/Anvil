      (research/14-critique-and-gaps.md B1 "Suggested fix") — before Milestone 1 proceeds. This row
      is a permanent instrument, not a kill gate; it is re-run, not retired.
    corpus:
      - name: >-
          The recall federation, chosen by the owner on 2026-10-03 (plan node recall): GitLab
          sast-rules at 53bf5cf6df3c51b6c02110f5a638b5e6213666cd, rule directories c, csharp, go,
          java, javascript, python and scala only
        licence: >-
          MIT Expat for content outside doc/ (CC BY-SA 4.0), ee/ and jh/, read from the LICENSE body
          at that commit on 2026-10-03; third-party components keep their own licences, so Phase 6
          vendors behind a directory allowlist
        licence_ref: the LICENSE body of gitlab-org/security-products/sast-rules at the pinned commit
      - name: opengrep engine v1.26.0 (subprocess only), which runs the GitLab and 0xdea rules
        licence: LGPL-2.1
        licence_ref: eval/tools/opengrep/LICENSES.md
      - name: gosec v2.29.0 (gosec_2.29.0_linux_amd64.tar.gz, sha256 6431b119741c1f4a50fdfcf94e782e16b9e642afc8c7fa9b5d39d48bf3003095)
        licence: Apache-2.0
        licence_ref: LICENSE.txt body at tag v2.29.0, read 2026-10-03
      - name: bandit 1.9.4
        licence: Apache-2.0
        licence_ref: LICENSE body at tag 1.9.4, read 2026-10-03
      - name: 0xdea/semgrep-rules at dae50da6e6e629750f1daec73a01ef9206a372ab (C and C++)
        licence: MIT
        licence_ref: LICENSE body at that commit, read 2026-10-03
      - name: >-
          The sample repositories, scanned locally and never redistributed: Anvil at the commit
          under measurement (Go), pallets/flask d73fa1cdcbd8b1465c151db8924ba58b1dd14e35 (Python),
          curl/curl 21983c2fca1e4ecf3393e94455b343d082b6f1c9 (C), spring-projects/spring-petclinic
          500158f732419217507c7656904b8e6aa1bcc0d6 (Java), expressjs/express
          7ef98448f8b38099ab1ded55e458538ad47a51e7 (JavaScript)
        licence: not redistributed; each repository's own licence applies to the local clone
        licence_ref: the repositories' own LICENSE files
    method: >-
      A re-runnable instrument (anvil_eval.candidates, a standalone callable) that runs the
      federation over a pinned repository and counts candidates. A candidate is one finding from one
      tool, de-duplicated across tools by (file, line, CWE). Full scan: the whole checkout at the
      pinned commit. Per push: each of the 20 most recent first-parent commits before the pinned
      commit, counting only candidates on lines that commit added or changed; the median and maximum
      are reported. The engine, every rule set and every repository are pinned by SHA in the result
      artifact. The candidate count recorded in the register row is the largest full-scan count over
      the five repositories.
