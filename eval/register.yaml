# Anvil — Milestone 0 experiment register
#
# Authored by step M0.1 (plan/10-milestone0-evaluation.md lines 33-58).
# Field list: plan/10-milestone0-evaluation.md "## Experiment Register Schema".
# Row content: plan/10-milestone0-evaluation.md "## Go/No-Go Decision Table".
# Validates against: eval/schema/register.schema.json
#
# ---------------------------------------------------------------------------
# HOW TO READ THE `decision` FIELD — read this before acting on any row.
#
#   `decision: UNRESOLVED`  means NOBODY HAS DECIDED YET. It is NOT a pass.
#                           It is NOT a "probably fine". It is the absence of
#                           a decision, stated out loud.
#
# Every row in this file is born UNRESOLVED and stays UNRESOLVED until an
# orchestrator-inline step writes PASS / FAIL / AMBIGUOUS / DEFERRED into it.
# There is no null, no empty string and no missing-key representation of an
# undecided row — the schema forbids all three — precisely so that a row whose
# decision was never recorded cannot be skimmed as if it had passed.
#
# Worker packets populate `result` only. They NEVER touch `decision`.
# (plan/10-milestone0-evaluation.md, note under "## Experiment Register Schema":
#  "`decision` is only ever set by an orchestrator-inline step ... never by a
#  worker packet".)
#
# EXP-01 and EXP-02 are the two kill criteria (plan/00-SPINE.md S3.1, S3.2).
# Step M0.18 reads their rows and decides whether Anvil's small-model detection
# tier exists at all. If either row still reads UNRESOLVED, M0.18 has no input
# and no Milestone-1 component-build packet may be dispatched.
# ---------------------------------------------------------------------------
#
# STATE AT AUTHORING (M0.1): nothing has been run.
#   - 14/14 rows        decision: UNRESOLVED
#   - 6 rows            status: not_started   (EXP-01..EXP-04, INSTR-01, S12-RTT)
#   - 8 rows            status: deferred      (EXP-05..EXP-12)
#   - 14/14 rows        result: all fields null
#   - `owning_future_phase` is null on every deferred row. Step M0.17 owns
#     populating it; the milestone exit criteria require it non-null before M0
#     closes. Null here means "not yet assigned", not "no owner needed".

