# Anvil A.4 — pinned acquisition manifest for publisher licence texts.
#
# Scope: this file is DATA ONLY. It records, per feed, WHERE the publisher's own
# licence text comes from, WHAT it must hash to, and WHICH SPDX identifier it is
# claimed to be. Nothing here downloads anything; see acquire-license-bodies.sh.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# plan/00-SPINE.md S8 requires a licence gate that reads "LICENSE file bodies,
# never API metadata". The point of that rule is that THE BODY IS THE
# PUBLISHER'S EVIDENCE.
#
# Before this file existed, every body internal/ingest/license read was Anvil
# prose — LICENSE-NOTES.md blocks and tier-2 LICENSE files, written in the same
# commit as the feed row they were validating. That is circular. It is worse
# than reading API metadata, because a reviewer sees a gate reading a file and
# stops asking who wrote the file.
#
# The shape below is the one M0.7 already established in this repository for the
# opengrep engine (eval/tools/opengrep/MANIFEST.toml): pin the artefact, keep the
# bytes out of git, acquire deliberately, verify on fetch, and refuse to run
# without it.
#
# ---------------------------------------------------------------------------
# EVERY ENTRY BELOW IS UNPINNED, AND THEREFORE EVERY FEED IS REFUSED.
# ---------------------------------------------------------------------------
# `sha256 = ""` means NO DIGEST HAS BEEN ESTABLISHED. Establishing one requires
# downloading the licence text, and no download has been performed or
# authorised. A digest written from memory would be a fabrication; a placeholder
# digest would admit feeds on a number nobody checked. So the honest value is
# empty, and the gate refuses every entry that carries it.
#
# A fresh clone of Anvil therefore mirrors NOTHING. That is deliberate and it is
# the correct state for a licence gate to ship in. To leave it, an operator:
#
#   1. runs `sh mirror/acquire-license-bodies.sh` (or the .ps1 on Windows),
#      which fetches each text_url below to <tier>/<dir>/LICENSE.full.txt and
#      prints its sha256;
#   2. READS the fetched text and satisfies themselves it is the operative
#      licence for that feed;
#   3. records the printed digest in the `sha256` field of that entry;
#   4. re-runs the script, which now VERIFIES rather than reports, and re-runs
#      `go test ./internal/ingest/license/`.
#
# From then on any change to the publisher's text — or to the acquired file —
# is a digest mismatch and a refusal, never a silent re-classification.
#
# ---------------------------------------------------------------------------
# A PIN IS NECESSARY AND NOT SUFFICIENT FOR TIERS 0 AND 1
# ---------------------------------------------------------------------------
# Tiers 0 and 1 are publishable. A feed reaches one only if the acquired text IS
# one of the permissive licences enumerated in
# internal/ingest/license/publishable.go — which takes BOTH a positive
# identification of exactly one of them AND the absence of any other
# licence-like content anywhere in the document. Unrecognised is refused,
# exactly as share-alike is, and so is a permissive licence with a second set of
# terms wrapped around it: unknown is not publishable and neither is ambiguous.
# See mirror/README.md.
#
# Three text_urls below are HTML PAGES rather than plain licence files —
# spdx.org/licenses/cve-tou.html (cvelistv5), cwe.mitre.org/about/termsofuse.html
# (cwe) and the NVD General FAQs (nvd). The phrases that identify those three
# were taken from the sentences research/01 quotes, because nobody has fetched
# the pages. If an acquired page does not match, the gate refuses the feed and
# TestPinnedLicenceBodiesMatchTheirPins names the file. That refusal is the
# correct direction. The response to it is to READ the acquired text and record
# its operative wording in publishable.go — never to widen a signature until
# something passes.
#
# THOSE SAME THREE ARE ALSO THE LIKELIEST FALSE REFUSALS UNDER THE SECOND
# CONDITION. A web page carries navigation, footers and boilerplate that a plain
# licence file does not, and any licence name in that chrome is read as a second
# set of terms. The response is the same in shape and opposite in direction:
# re-pin a plain operative text. Deleting a veto marker so that one page passes
# weakens the check for every feed.
#
# ---------------------------------------------------------------------------
# PROVENANCE OF THE URLs
# ---------------------------------------------------------------------------
# text_url and claim_url are transcribed from the source table of
# research/01-vuln-data-sources-and-licensing.md, whose rows were fetched
# 2026-08-05/06. The creativecommons.org legalcode URLs are the canonical
# published locations of those licence texts and were NOT fetched in-session —
# they are the addresses already named in mirror/tier2/*/LICENSE. If one is
# wrong the acquisition script fails loudly on it, which is the intended way to
# find out.
#
# claim_source is the citation for the claim that a feed is under the named
# licence. It is separate from text_url because the two are often different
# documents, and the gap between them is the whole measure of how strong a
# licence conclusion is. Ubuntu is the worked example: the TEXT is the
# CC-BY-SA-4.0 legalcode, but the CLAIM that Ubuntu's data is under it rests on
# OSV's source table, not on anything Canonical has ever said.
#
# ---------------------------------------------------------------------------
# WHAT IS DELIBERATELY ABSENT
# ---------------------------------------------------------------------------
# EPSS (feed id `epss`, tier 3) HAS NO ENTRY AND MUST NOT BE GIVEN ONE.
# research/01 S18/S19 record no licence document and no SPDX identifier for it;
# "attribution is requested" is a request, not a grant of rights. There is no
# publisher licence text to pin, so there is no pin, so the gate refuses the
# feed with ErrUnpinnedLicenseBody. That refusal is the correct and permanent
# answer for a source that has never licensed its data, and inventing an entry
# to make the refusal go away would be the exact defect this file was written
# to remove.

schema_version = 1
generated_utc = "2026-08-09"
generated_by = "Anvil implementation plan, step A.4 (post-A.6 rework)"

